<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ED Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3347;--saffron:#f59e0b;--saffron-dim:#92600a;--green:#22c55e;--red:#ef4444;--text:#e8eaf0;--text-dim:#8b90a7;--text-muted:#565c78;--radius:12px;--radius-sm:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:80px}
.mono{font-family:'JetBrains Mono',monospace}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100;padding:4px 0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 4px;gap:3px;background:none;border:none;color:var(--text-muted);font-size:10px;font-weight:500;letter-spacing:.03em;cursor:pointer;font-family:inherit;transition:color .15s}
.nav-item.active{color:var(--saffron)}
.nav-item svg{width:20px;height:20px}
.mod-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.mod-btn{flex:1;padding:12px 8px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.mod-btn.active{color:var(--saffron);border-bottom-color:var(--saffron)}
.screen{display:none;min-height:calc(100vh - 140px)}
.screen.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600;margin-bottom:10px}
.page-header{padding:20px 16px 12px;border-bottom:1px solid var(--border)}
.page-eyebrow{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.page-title{font-size:22px;font-weight:700}
.page-subtitle{font-size:13px;color:var(--text-dim);margin-top:4px}
.page-body{padding:12px 16px}
input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
input:focus,select:focus{border-color:var(--saffron)}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;font-weight:500}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;border:none;transition:opacity .15s}
.btn:active{opacity:.8}
.btn-primary{background:var(--saffron);color:#000}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-warn{background:rgba(245,158,11,.15);color:var(--saffron);border:1px solid var(--saffron-dim)}
.badge-ok{background:rgba(34,197,94,.15);color:var(--green)}
.badge-low{background:rgba(245,158,11,.15);color:var(--saffron)}
.badge-crit{background:rgba(239,68,68,.15);color:var(--red)}
.badge-info{background:rgba(96,165,250,.15);color:#60a5fa}
table{width:100%;border-collapse:collapse}
th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;padding:8px 0;text-align:left;border-bottom:1px solid var(--border)}
td{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
tr:last-child td{border-bottom:none}
.rm-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.rm-row:last-child{border-bottom:none}
.rm-name{font-size:14px;font-weight:500}
.rm-unit{font-size:11px;color:var(--text-muted);margin-top:2px}
.rm-price-wrap{display:flex;align-items:center;gap:4px}
.rm-currency{font-size:13px;color:var(--text-muted)}
.rm-price-input{width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 6px;color:var(--text);font-size:14px;font-family:inherit;text-align:right}
.product-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.product-tag{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:4px;margin-bottom:8px;display:inline-block}
.tag-rtc{background:rgba(245,158,11,.15);color:var(--saffron)}
.tag-rte{background:rgba(96,165,250,.15);color:#60a5fa}
.product-name{font-size:15px;font-weight:600}
.product-id{font-size:11px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.product-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.product-cost{font-size:20px;font-weight:700;color:var(--saffron)}
.product-cost-label{font-size:10px;color:var(--text-muted);text-align:right}
.product-meta{display:flex;gap:12px}
.product-meta-item{font-size:11px;color:var(--text-muted)}
.product-meta-item span{color:var(--text-dim);font-weight:500}
.cost-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.cost-label{font-size:13px}
.cost-label small{display:block;font-size:10px;color:var(--text-muted)}
.cost-val{font-size:13px;font-weight:600}
.order-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.order-steps{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.step{padding:3px 8px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);font-size:10px}
.step:first-child{border-radius:6px 0 0 6px}
.step:last-child{border-radius:0 6px 6px 0}
.step.done{background:rgba(34,197,94,.1);color:var(--green);border-color:rgba(34,197,94,.3)}
.step.active{background:rgba(96,165,250,.1);color:#60a5fa;border-color:rgba(96,165,250,.3);font-weight:500}
.alert{padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:12px}
.alert-warn{background:rgba(245,158,11,.1);border:1px solid var(--saffron-dim);color:var(--saffron)}
.alert-info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);color:#60a5fa}
.alert-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.alert-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--red)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.open{display:flex}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.infra-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--saffron);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.stat-box{background:var(--surface2);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-val{font-size:20px;font-weight:700}
.stat-label{font-size:10px;color:var(--text-muted);margin-top:2px}
.remove-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px;flex-shrink:0}
.divider{height:1px;background:var(--border);margin:16px 0}
.history-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;cursor:pointer}
.history-date{font-size:11px;color:var(--text-muted)}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:360px}
.rm-add-inp{background:rgba(59,130,246,.1);border:2px solid #3b82f6;border-radius:6px;color:#60a5fa;font-size:14px;font-weight:600;padding:6px 8px;text-align:right}
.ing-row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.ing-row select,.ing-row input{flex:1;min-width:0}
.price-table{width:100%;border-collapse:collapse}
.price-table th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;padding:8px 0;text-align:left;border-bottom:1px solid var(--border)}
.price-table td{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1f2937;color:#e8eaf0;padding:10px 20px;border-radius:99px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid #374151}
.toast.show{opacity:1}
@media(max-width:380px){.two-col,.three-col{grid-template-columns:1fr}.page-title{font-size:18px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SB = 'https://frtpolvxblbwgrqvdmsq.supabase.co';
const KEY = 'sb_publishable_GlsF2nHMpqyCo7yrNr96jw_mI3br-91';

const USERS = {
  'nishant': {pw:'ed2024',  role:'owner',   name:'Nishant',        loc:'Pune'},
  'amit':    {pw:'amit123', role:'owner',   name:'Amit Patil',     loc:'Pune'},
  'mumbai1': {pw:'mbai001', role:'mumbai',  name:'Mumbai Manager', loc:'Mumbai'},
  'mumbai2': {pw:'mbai002', role:'mumbai',  name:'Mumbai Staff',   loc:'Mumbai'},
};

const SKUS = [
  {id:'chap8',       name:'Chapati 8"',  packSize:25},
  {id:'chap9',       name:'Chapati 9"',  packSize:25},
  {id:'puri_plain',  name:'Puri plain',  packSize:50},
  {id:'puri_masala', name:'Puri masala', packSize:50},
  {id:'dal_pakwan',  name:'Dal pakwan',  packSize:20},
  {id:'bhature',     name:'Bhature',     packSize:20},
];

const ATTA_OPTIONS = {
  siddhikala: { name: 'Siddhikala', rate: 45 },
  khapli:     { name: 'Khapli', rate: 80 },
  custom:     { name: 'Custom', rate: null },
};

const LOW=5, CRIT=2;

// ============================================================
// STORAGE (safe for file:// and https://)
// ============================================================
const _store = {_d:{},
  getItem(k){try{return sessionStorage.getItem(k);}catch(e){return this._d[k]||null;}},
  setItem(k,v){try{sessionStorage.setItem(k,v);}catch(e){this._d[k]=v;}},
  removeItem(k){try{sessionStorage.removeItem(k);}catch(e){delete this._d[k];}}
};

// ============================================================
// SUPABASE HELPERS
// ============================================================
const H = () => ({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'});

async function sbGet(table, qs=''){
  const r = await fetch(`${SB}/rest/v1/${table}?${qs}`, {headers:H()});
  if(!r.ok) return [];
  return r.json();
}
async function sbPost(table, body){
  const r = await fetch(`${SB}/rest/v1/${table}`, {
    method:'POST', headers:{...H(),'Prefer':'return=representation'}, body:JSON.stringify(body)
  });
  return r.json();
}
async function sbPatch(table, match, body){
  const qs = Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  const r = await fetch(`${SB}/rest/v1/${table}?${qs}`, {
    method:'PATCH', headers:{...H(),'Prefer':'return=representation'}, body:JSON.stringify(body)
  });
  return r.json();
}
async function sbDelete(table, match){
  const qs = Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  await fetch(`${SB}/rest/v1/${table}?${qs}`, {method:'DELETE', headers:H()});
}
async function sbGetState(key){
  try{
    const r = await fetch(`${SB}/rest/v1/biz_app_state?key=eq.${key}&select=value`, {headers:H()});
    const d = await r.json();
    return d&&d[0] ? d[0].value : null;
  }catch(e){return null;}
}
async function sbSetState(key, value){
  try{
    await fetch(`${SB}/rest/v1/biz_app_state?key=eq.${key}`, {method:'DELETE', headers:H()});
    await fetch(`${SB}/rest/v1/biz_app_state`, {
      method:'POST',
      headers:{...H(),'Prefer':'return=minimal'},
      body:JSON.stringify({key, value, updated_at:new Date().toISOString()})
    });
  }catch(e){}
}

// ============================================================
// APP STATE
// ============================================================
let user = _store.getItem('ed_user') || null;
let activeModule = 'distributor'; // distributor | production | business
let activeScreen = 'rm';          // business sub-screen
let activeTab = 'inventory';       // distributor/production sub-tab
let pollTimer = null;

// Inventory data (from Supabase tables)
let inv={}, orders=[], dispatches=[], actlog=[];
let rawMaterials=[], recipes=[], recipeIngredients=[], recipeVariants=[], skuMap=[], productionPlans=[];

// Business state (from biz_app_state)
let bizState = {
  rm:{}, infra:{}, labour:[], quotes:[], currentMargin:15,
  customProducts:{}, _lastSaved:0
};

// UI state
let expandedOrders = new Set();
let editingRecipe = null;
let recipeFormOpen = false;
let rmModalOpen = false;
let rmModalData = null;
let rmDirty = new Set();
let _editingProductId = null;

// ============================================================
// UTILS
// ============================================================
function skuName(id){ return SKUS.find(s=>s.id===id)?.name||id; }
function ft(ts){ return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fd(d){ return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function rupees(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function statusBadge(p){
  if(p<=CRIT) return `<span class="badge badge-crit">Critical</span>`;
  if(p<=LOW)  return `<span class="badge badge-low">Low</span>`;
  return `<span class="badge badge-ok">OK</span>`;
}
function setMsg(id,txt,ok){
  const el=document.getElementById(id); if(!el) return;
  el.style.color=ok?'var(--green)':'var(--red)'; el.textContent=txt;
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

function markRMDirty(id){
  rmDirty.add(parseInt(id));
  const inp=document.querySelector(`.rm-add-inp[data-id="${id}"]`);
  if(inp) inp.style.borderColor='var(--saffron)';
  const btn=document.getElementById('rm-save-all-btn');
  if(btn){
    btn.style.background='rgba(245,158,11,.2)';btn.style.color='var(--saffron)';
    btn.textContent=`Save ${rmDirty.size} update${rmDirty.size>1?'s':''}`;
  }
}

function ingQtyInRMUnit(qty_per_kg, ing_unit, batch_kg, rm_unit){
  const raw=qty_per_kg*batch_kg;
  const i=ing_unit?.toLowerCase(); const r=rm_unit?.toLowerCase();
  if(i===r) return raw;
  if(i==='g'&&r==='kg') return raw/1000;
  if(i==='kg'&&r==='g') return raw*1000;
  if(i==='ml'&&r==='litre') return raw/1000;
  if(i==='litre'&&r==='ml') return raw*1000;
  return raw;
}

// ============================================================
// DATA LOADING
// ============================================================
async function loadInventory(){
  const [a,b,c,d] = await Promise.all([
    sbGet('inventory',''),
    sbGet('orders','order=id.desc&limit=60'),
    sbGet('dispatches','order=id.desc&limit=40'),
    sbGet('activity_log','order=id.desc&limit=80'),
  ]);
  inv={}; (a||[]).forEach(r=>inv[r.sku]={packs:r.packs});
  orders=b||[]; dispatches=c||[]; actlog=d||[];
}

async function loadProduction(){
  const [a,b,c,d,e,f] = await Promise.all([
    sbGet('raw_materials','order=name.asc'),
    sbGet('recipes','order=id.asc'),
    sbGet('recipe_ingredients','order=recipe_id.asc'),
    sbGet('recipe_variants','order=recipe_id.asc'),
    sbGet('sku_recipe_map',''),
    sbGet('production_plans','order=planned_date.asc&limit=50'),
  ]);
  rawMaterials=a||[]; recipes=b||[]; recipeIngredients=c||[];
  recipeVariants=d||[]; skuMap=e||[]; productionPlans=f||[];

  // Sync costing prices from raw_materials into bizState
  rawMaterials.forEach(rm => {
    if(rm.costing_price>0 && !bizState.rm[rm.id]) bizState.rm[rm.id]=rm.costing_price;
  });
}

async function loadBizState(){
  try{
    const local = localStorage.getItem('ed_biz_state');
    if(local) bizState = {...bizState, ...JSON.parse(local)};
  }catch(e){}
  applyBizDefaults();

  // Sync from cloud
  const cloud = await sbGetState('app_state');
  if(cloud){
    const localTs = bizState._lastSaved||0;
    const cloudTs = cloud._lastSaved||0;
    const localCP = bizState.customProducts||{};
    const localQ  = bizState.quotes||[];
    bizState = {...bizState, ...cloud};
    // Merge
    if(localTs>=cloudTs) bizState.customProducts=localCP;
    else bizState.customProducts={...(cloud.customProducts||{}), ...localCP};
    const allQ=[...(cloud.quotes||[]),...localQ];
    const seen=new Set();
    bizState.quotes=allQ.filter(q=>{const k=q.id||(q.buyer+q.ts);if(seen.has(k))return false;seen.add(k);return true;});
    applyBizDefaults();
    localStorage.setItem('ed_biz_state',JSON.stringify(bizState));
  }
}

function applyBizDefaults(){
  if(!bizState.rm||!Object.keys(bizState.rm).length) bizState.rm={};
  if(!bizState.infra||!Object.keys(bizState.infra).length){
    bizState.infra={shift_vol:8000,shifts:2,days:26,rent:30000,elec:83200,lpg:83200,maint:20000,capex:40000,pkg:0.25,elec_rte:0.384,elec_rtc:0.384,roasting:0.375};
  }
  if(!bizState.labour||!bizState.labour.length){
    bizState.labour=[
      {role:'Dough Mixing Labour',count:1,salary:12000},
      {role:'Machine Labour (Pressing)',count:2,salary:12000},
      {role:'Packaging Labour',count:2,salary:12000},
      {role:'Sealing Labour',count:1,salary:12000},
      {role:'Supervisor',count:1,salary:20000},
      {role:'Labour Head',count:1,salary:25000},
    ];
  }
  if(!bizState.quotes) bizState.quotes=[];
  if(!bizState.customProducts) bizState.customProducts={};
  if(!bizState.currentMargin) bizState.currentMargin=15;
}

function saveBizState(){
  bizState._lastSaved=Date.now();
  localStorage.setItem('ed_biz_state',JSON.stringify(bizState));
  sbSetState('app_state',bizState).catch(()=>{});
}

async function addLog(action,sku,detail){
  await sbPost('activity_log',{action,sku,detail,done_by:user});
}

async function loadAll(){
  await Promise.all([loadInventory(), loadProduction(), loadBizState()]);
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async()=>{
    if(!user){clearInterval(pollTimer);return;}
    if(activeModule==='production'&&(rmDirty.size>0||rmModalOpen)) return;
    if(activeModule==='production'&&recipeFormOpen) return;
    if(activeModule==='production'&&activeTab==='plan') return;
    if(activeModule==='distributor'&&expandedOrders.size>0) return;
    await loadAll(); render();
  }, 20000);
}

// ============================================================
// RM ALARM ENGINE
// ============================================================
function computeRMNeeds(){
  if(!rawMaterials.length||!recipes.length) return [];
  const demands=[];
  orders.filter(o=>o.status==='pending'||o.status==='approved').forEach(o=>{
    const map=skuMap.find(m=>m.sku===o.sku);
    if(!map) return;
    const variant=recipeVariants.find(v=>v.id===map.recipe_variant_id);
    if(!variant||!variant.pieces_per_kg||!variant.pack_size_pieces) return;
    const totalPieces=o.qty*(variant.pack_size_pieces||1);
    const kgNeeded=totalPieces/variant.pieces_per_kg;
    demands.push({recipe_id:variant.recipe_id, kg:kgNeeded});
  });
  productionPlans.filter(p=>p.status==='planned').forEach(p=>{
    demands.push({recipe_id:p.recipe_id, kg:p.planned_kg});
  });
  if(!demands.length) return [];
  const rmNeeded={};
  demands.forEach(d=>{
    const ings=recipeIngredients.filter(i=>i.recipe_id===d.recipe_id);
    ings.forEach(ing=>{
      const rm=rawMaterials.find(r=>r.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm) return;
      const needed=ingQtyInRMUnit(ing.qty_per_kg,ing.unit,d.kg,rm.unit);
      if(!rmNeeded[rm.id]) rmNeeded[rm.id]={rm,needed:0};
      rmNeeded[rm.id].needed+=needed;
    });
  });
  return Object.values(rmNeeded).filter(x=>x.needed>x.rm.stock_qty).map(x=>({...x,shortage:x.needed-x.rm.stock_qty}));
}

// ============================================================
// BUSINESS COSTING HELPERS
// ============================================================
function getRMRate(id){
  // First check bizState overrides, then costing_price from Supabase
  if(bizState.rm[id]) return parseFloat(bizState.rm[id]);
  const rm = rawMaterials.find(r=>r.id==id||r.name.toLowerCase()===id.toLowerCase());
  if(rm&&rm.costing_price>0) return rm.costing_price;
  return 0;
}

function getEffectiveRecipe(recipeId){
  // Returns {rm_formula, dough_sizes, pack_default, name, ...}
  // Merges Supabase recipe with any customProduct overrides
  const base = recipes.find(r=>r.id===recipeId);
  if(!base) return null;
  const ings = recipeIngredients.filter(i=>i.recipe_id===recipeId);
  const variants = recipeVariants.filter(v=>v.recipe_id===recipeId);

  // Build rm_formula from recipe_ingredients (ingredient_name -> qty_per_kg)
  const rm_formula={};
  ings.forEach(i=>{ rm_formula[i.ingredient_name]=i.qty_per_kg; });

  // dough_sizes from variants
  const dough_sizes = variants.map(v=>({grams:v.dough_ball_g, inches:v.output_size, pack:v.pack_size_pieces}));

  const base_recipe = {
    id:base.id, name:base.name, product:base.product,
    rm_formula, dough_sizes,
    pack_default: dough_sizes[0]?.pack||10,
    flour_grams: ings.reduce((a,i)=>a+i.qty_per_kg,0)||1000,
  };

  // Apply any custom overrides
  const overrides = bizState.customProducts&&bizState.customProducts[recipeId];
  if(!overrides) return base_recipe;
  return {...base_recipe, ...overrides};
}

function calcCostPerPiece(recipe, doughGrams){
  if(!recipe||!doughGrams) return 0;
  let total=0;
  for(const [ingName, grams] of Object.entries(recipe.rm_formula)){
    const rm = rawMaterials.find(r=>r.name.toLowerCase()===ingName.toLowerCase());
    const rate = rm ? getRMRate(rm.id) : 0;
    total += (grams/1000)*rate;
  }
  const piecesPerKg = (recipe.flour_grams||1000)/doughGrams;
  return total/piecesPerKg;
}

function getInfraCostPerPiece(type){
  const inf=bizState.infra;
  const monthlyCapacity=(inf.shift_vol||8000)*(inf.shifts||2)*(inf.days||26);
  const labourMonthly=(bizState.labour||[]).reduce((s,l)=>s+(l.count*l.salary),0);
  const fixedPool=labourMonthly+parseFloat(inf.rent||0)+parseFloat(inf.maint||0)+parseFloat(inf.capex||0);
  const labourRentPerPiece=fixedPool/monthlyCapacity;
  const elecPerPiece=parseFloat(type==='rte'?inf.elec_rte:inf.elec_rtc)||0;
  const roastingPerPiece=type==='rte'?(parseFloat(inf.roasting)||0):0;
  const maintPerPiece=parseFloat(inf.maint||0)/monthlyCapacity;
  return{labour_rent:labourRentPerPiece,elec:elecPerPiece,roasting:roastingPerPiece,maint:maintPerPiece,
    total:labourRentPerPiece+elecPerPiece+roastingPerPiece+maintPerPiece};
}

function updateRMPreview(id, addedStr, current){
  const added=parseFloat(addedStr)||0;
  const newTotal=current+added;
  const el=document.getElementById(`rm-total-${id}`);
  if(el){el.textContent=newTotal%1===0?newTotal:newTotal.toFixed(3).replace(/\.?0+$/,'');el.style.color=added>0?'#60a5fa':'var(--text)';}
  if(added!==0) rmDirty.add(id); else rmDirty.delete(id);
  const btn=document.getElementById('rm-save-all-btn');
  if(btn){
    if(rmDirty.size>0){btn.style.background='rgba(245,158,11,.2)';btn.style.color='var(--saffron)';btn.textContent=`Save ${rmDirty.size} update${rmDirty.size>1?'s':''}`;}
    else{btn.style.background='';btn.style.color='';btn.textContent='Save all';}
  }
}

function renderReportTab(alarms){
  const production=recipes.map(r=>{
    const ings=recipeIngredients.filter(i=>i.recipe_id===r.id);
    if(!ings.length) return null;
    let maxKg=Infinity;
    ings.forEach(ing=>{
      const rm=rawMaterials.find(x=>x.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm||!ing.qty_per_kg) return;
      const needed=ingQtyInRMUnit(ing.qty_per_kg,ing.unit,1,rm.unit);
      if(needed>0) maxKg=Math.min(maxKg,rm.stock_qty/needed);
    });
    return{recipe:r,maxKg:maxKg===Infinity?0:maxKg};
  }).filter(Boolean);

  return `
${alarms.length?`<div class="card" style="border-color:rgba(239,68,68,.4)">
  <div class="card-label" style="color:var(--red)">⚠️ RM shortages</div>
  <table><thead><tr><th>Material</th><th>Have</th><th>Need</th><th>Short</th></tr></thead>
  <tbody>${alarms.map(a=>`<tr style="background:rgba(239,68,68,.05)">
    <td style="font-weight:500">${a.rm.name}</td>
    <td>${a.rm.stock_qty} ${a.rm.unit}</td>
    <td style="color:var(--red)">${a.needed.toFixed(2)}</td>
    <td style="color:var(--red);font-weight:600">${a.shortage.toFixed(2)} short</td>
  </tr>`).join('')}</tbody></table>
</div>`:`<div class="alert alert-ok">✓ All materials sufficient for active orders & plans.</div>`}

<div class="card">
  <div class="card-label">What can we produce now?</div>
  <table><thead><tr><th>Recipe</th><th>Max kg</th></tr></thead>
  <tbody>${production.map(p=>`<tr>
    <td>${p.recipe.name}</td>
    <td style="font-weight:600;color:${p.maxKg<1?'var(--red)':p.maxKg>=5?'var(--green)':'var(--saffron)'}">${p.maxKg.toFixed(1)} kg</td>
  </tr>`).join('')}${production.length===0?'<tr><td colspan="2" style="color:var(--text-muted)">No recipes with ingredients mapped.</td></tr>':''}</tbody></table>
</div>

<div class="card">
  <div class="card-label">Stock snapshot</div>
  <table><thead><tr><th>Material</th><th>Stock</th><th>Reorder at</th><th>Status</th></tr></thead>
  <tbody>${rawMaterials.map(r=>`<tr style="${r.stock_qty<=(r.reorder_threshold||0)&&r.reorder_threshold>0?'background:rgba(245,158,11,.05)':''}">
    <td style="font-weight:500">${r.name}</td>
    <td>${r.stock_qty} ${r.unit}</td>
    <td style="color:var(--text-muted)">${r.reorder_threshold} ${r.unit}</td>
    <td>${r.stock_qty<=(r.reorder_threshold||0)&&r.reorder_threshold>0?'<span class="badge badge-low">Reorder</span>':'<span class="badge badge-ok">OK</span>'}</td>
  </tr>`).join('')}</tbody></table>
</div>`;
}

function saveBizRates(){

function renderBizProducts(){
  if(!recipes.length) return '<div style="color:var(--text-muted);text-align:center;padding:32px">No recipes yet. Add recipes in the Production module first.</div>';
  return recipes.map(r=>{
    const recipe=getEffectiveRecipe(r.id);
    if(!recipe||!recipe.dough_sizes.length) return '';
    const firstSize=recipe.dough_sizes[0];
    const rmCost=calcCostPerPiece(recipe,firstSize.grams);
    const infCost=getInfraCostPerPiece('rtc');
    const pkg=parseFloat(bizState.infra.pkg||0.25);
    const total=rmCost+infCost.total+pkg;
    const isCustomised=bizState.customProducts&&bizState.customProducts[r.id];

    return `<div class="product-card">
      <span class="product-tag tag-rtc">RTC</span>
      ${isCustomised?'<span style="font-size:9px;background:rgba(34,197,94,.15);color:var(--green);border-radius:4px;padding:2px 6px;margin-left:4px">edited</span>':''}
      <div class="product-header">
        <div>
          <div class="product-name">${r.name}</div>
          <div class="product-id">${r.id}</div>
        </div>
        <div style="text-align:right">
          <div class="product-cost">₹${total.toFixed(2)}</div>
          <div class="product-cost-label">cost/piece<br><span style="font-size:9px">${firstSize.grams}g</span></div>
        </div>
      </div>
      <div class="product-meta">
        <div class="product-meta-item">RM: <span>₹${rmCost.toFixed(2)}</span></div>
        <div class="product-meta-item">Infra: <span>₹${infCost.total.toFixed(2)}</span></div>
        <div class="product-meta-item">Pack: <span>₹${pkg.toFixed(2)}</span></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button onclick="showBizProductDetail('${r.id}')" class="btn btn-ghost" style="flex:1;padding:8px;font-size:12px">View breakdown</button>
        <button onclick="openBizRecipeEdit('${r.id}')" class="btn btn-ghost" style="flex:1;padding:8px;font-size:12px;border-color:var(--saffron);color:var(--saffron)">✏ Edit recipe</button>
      </div>
    </div>`;
  }).join('');
}

function showBizProductDetail(recipeId){
  const recipe=getEffectiveRecipe(recipeId);
  if(!recipe) return;
  const modal=document.getElementById('biz-product-modal');
  const content=document.getElementById('biz-modal-content');
  if(!modal||!content) return;

  let rows='';
  for(const [ingName, grams] of Object.entries(recipe.rm_formula)){
    const rm=rawMaterials.find(r=>r.name.toLowerCase()===ingName.toLowerCase());
    const rate=rm?getRMRate(rm.id):0;
    const cost=(grams/1000)*rate;
    rows+=`<div class="cost-row"><div class="cost-label">${ingName}<small>${grams}g/kg @ ₹${rate}/${rm?.unit||'kg'}</small></div><div class="cost-val mono">₹${cost.toFixed(3)}</div></div>`;
  }

  const sizes=recipe.dough_sizes.map(s=>{
    const rm=calcCostPerPiece(recipe,s.grams);
    const inf=getInfraCostPerPiece('rtc');
    const pkg=parseFloat(bizState.infra.pkg||0.25);
    return `<tr><td>${s.grams}g / ${s.inches}</td><td class="mono">₹${rm.toFixed(2)}</td><td class="mono">₹${(inf.total+pkg).toFixed(2)}</td><td class="mono" style="color:var(--saffron);font-weight:600">₹${(rm+inf.total+pkg).toFixed(2)}</td></tr>`;
  }).join('');

  content.innerHTML=`
    <div style="font-size:18px;font-weight:700;margin-bottom:4px">${recipe.name}</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:16px">${recipeId}</div>
    <div class="card-label">Ingredient costs (per kg dough)</div>
    <div style="margin-bottom:16px">${rows}</div>
    <div class="card-label">Cost by dough size</div>
    <table class="price-table">

const INPSTYLE='background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;font-family:inherit;width:100%';

function makeBizIngRow(name,grams){
  const div=document.createElement('div');
  div.className='ing-row';
  div.style.cssText='display:flex;gap:6px;margin-bottom:6px;align-items:center';
  const rmOpts=rawMaterials.map(r=>`<option value="${r.name}" ${r.name===name?'selected':''}>${r.name}</option>`).join('');
  const inp=document.createElement('input');
  inp.type='number';inp.value=grams||'';inp.min=0;inp.step=0.1;inp.placeholder='g';
  inp.style.cssText=INPSTYLE+';flex:0 0 80px;text-align:right';
  const sel=document.createElement('select');
  sel.style.cssText=INPSTYLE+';flex:1';
  sel.innerHTML=rmOpts||`<option value="${name}">${name}</option>`;
  const unit=document.createElement('span');
  unit.textContent='g';unit.style.cssText='color:var(--text-muted);font-size:11px;flex-shrink:0';
  const del=document.createElement('button');
  del.textContent='✕';del.style.cssText='background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;padding:6px 8px;font-size:12px';
  del.onclick=()=>div.remove();
  div.appendChild(sel);div.appendChild(inp);div.appendChild(unit);div.appendChild(del);
  return div;
}
function makeBizSizeRow(grams,inches){
  const div=document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:90px 1fr 36px;gap:6px;margin-bottom:6px;align-items:center';
  const g=document.createElement('input');
  g.type='number';g.value=grams||'';g.min=1;g.step=1;g.placeholder='g';
  g.style.cssText=INPSTYLE+';text-align:right';
  const s=document.createElement('input');
  s.type='text';s.value=inches||'';s.placeholder='e.g. 8"';s.style.cssText=INPSTYLE;
  const del=document.createElement('button');
  del.textContent='✕';del.style.cssText='background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text-muted);cursor:pointer;padding:6px;font-size:12px';
  del.onclick=()=>div.remove();
  div.appendChild(g);div.appendChild(s);div.appendChild(del);
  return div;
}

function updateBizQuoteOptions(){
  const pid=document.getElementById('q-product').value;
  const recipe=getEffectiveRecipe(pid);
  const sel=document.getElementById('q-dough');
  sel.innerHTML='<option value="">Select size…</option>';
  if(recipe){
    recipe.dough_sizes.forEach(s=>{
      const o=document.createElement('option');
      o.value=s.grams;o.textContent=`${s.grams}g / ${s.inches}`;
      sel.appendChild(o);
    });
    document.getElementById('q-pack').value=recipe.pack_default||10;
  }
  calculateBizQuote();
}

function calculateBizQuote(){
  const pid=document.getElementById('q-product').value;
  const doughG=parseFloat(document.getElementById('q-dough').value);
  const qty=parseFloat(document.getElementById('q-qty').value)||0;
  const pack=parseFloat(document.getElementById('q-pack').value)||10;
  const resultEl=document.getElementById('q-result');
  if(!pid||!doughG){if(resultEl)resultEl.style.display='none';return;}

  const recipe=getEffectiveRecipe(pid);
  if(!recipe){return;}
  const rmCost=calcCostPerPiece(recipe,doughG);
  const infCost=getInfraCostPerPiece('rtc');
  const pkgCost=parseFloat(bizState.infra.pkg||0.25);
  const totalCost=rmCost+infCost.total+pkgCost;
  const margin=bizState.currentMargin/100;
  const sellingPrice=totalCost/(1-margin);
  const pricePerPack=sellingPrice*pack;
  const monthly=sellingPrice*qty;

  if(resultEl){
    resultEl.style.display='block';
    document.getElementById('q-result-content').innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
      <div class="stat-box"><div class="stat-val" style="font-size:16px">₹${totalCost.toFixed(2)}</div><div class="stat-label">Cost/piece</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:16px;color:var(--green)">₹${sellingPrice.toFixed(2)}</div><div class="stat-label">Selling price/piece</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:16px">₹${pricePerPack.toFixed(2)}</div><div class="stat-label">Per pack (${pack}pcs)</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:14px">₹${(monthly/100000).toFixed(2)}L</div><div class="stat-label">Monthly revenue</div></div>
    </div>
    <div style="font-size:12px;color:var(--text-muted)">Margin: ${bizState.currentMargin}% · RM: ₹${rmCost.toFixed(2)} · Infra: ₹${infCost.total.toFixed(2)} · Pack: ₹${pkgCost.toFixed(2)}</div>`;
  }
}

function setBizMargin(pct,btn){
  bizState.currentMargin=pct;
  document.querySelectorAll('#margin-btns .btn').forEach(b=>{
    b.style.background='';b.style.color='';b.style.borderColor='';
  });
  btn.style.background='var(--saffron)';btn.style.color='#000';btn.style.borderColor='var(--saffron)';
  calculateBizQuote();
}

function saveBizQuote(){
  const buyer=document.getElementById('q-buyer').value.trim();
  const city=document.getElementById('q-city').value.trim();
  const pid=document.getElementById('q-product').value;
  const doughG=parseFloat(document.getElementById('q-dough').value);
  const qty=parseFloat(document.getElementById('q-qty').value)||0;
  const pack=parseFloat(document.getElementById('q-pack').value)||10;
  if(!buyer||!pid||!doughG){showToast('Fill buyer, product and size first');return;}
  const recipe=getEffectiveRecipe(pid);
  const rmCost=calcCostPerPiece(recipe,doughG);
  const infCost=getInfraCostPerPiece('rtc');
  const pkgCost=parseFloat(bizState.infra.pkg||0.25);
  const totalCost=rmCost+infCost.total+pkgCost;
  const sellingPrice=totalCost/(1-bizState.currentMargin/100);
  bizState.quotes.push({

}

function bindShell(){
  // Module nav
  document.querySelectorAll('[data-mod]').forEach(b=>b.addEventListener('click',()=>{
    activeModule=b.dataset.mod;
    activeTab='inventory'; activeScreen='rm';
    recipeFormOpen=false;editingRecipe=null;rmModalOpen=false;rmModalData=null;rmDirty.clear();
    render();
  }));
  // Sub tabs (distributor + production)
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
    activeTab=b.dataset.tab;
    recipeFormOpen=false;editingRecipe=null;rmDirty.clear();
    render();
  }));
  // Business sub-screens
  document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>{
    activeScreen=b.dataset.screen; render();
  }));
  // Logout
  document.querySelectorAll('[data-action="logout"]').forEach(b=>b.addEventListener('click',()=>{
    user=null;_store.removeItem('ed_user');if(pollTimer)clearInterval(pollTimer);render();
  }));

  bindDistributorEvents();
  if(USERS[user]?.role==='owner'){
    bindProductionEvents();
    bindBusinessEvents();
  }
}

function bindDistributorEvents(){
  document.querySelectorAll('[data-action="adj"]').forEach(b=>b.addEventListener('click',async()=>{
    const sku=b.dataset.sku,cur=inv[sku]?.packs||0;
    const v=prompt(`Adjust packs for ${skuName(sku)}\nCurrent: ${cur}\n\nNew count:`);
    if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0){alert('Invalid');return;}
    await sbPatch('inventory',{sku},{packs:n,updated_by:user});
    await addLog('Adjusted',sku,`${cur}→${n} packs`);await loadInventory();render();
  }));
  document.querySelectorAll('[data-action="mset"]').forEach(b=>b.addEventListener('click',async()=>{
    const sku=b.dataset.sku,cur=inv[sku]?.packs||0;
    const v=prompt(`Set packs for ${skuName(sku)}\nCurrent: ${cur}\n\nActual count:`);
    if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0){alert('Invalid');return;}
    await sbPatch('inventory',{sku},{packs:n,updated_by:user});
    await addLog('Stock set',sku,`Set to ${n} packs`);await loadInventory();render();
  }));
  document.getElementById('ord-btn')?.addEventListener('click',async()=>{
    const sku=document.getElementById('ord-sku').value;
    const qty=parseInt(document.getElementById('ord-qty').value);
    const urgency=document.getElementById('ord-urgency').value;
    const note=document.getElementById('ord-note').value.trim();
    if(isNaN(qty)||qty<1){setMsg('ord-msg','Enter valid quantity.',false);return;}
    const btn=document.getElementById('ord-btn');btn.disabled=true;btn.textContent='Placing…';
    await sbPost('orders',{sku,qty,urgency,note,placed_by:user,status:'pending'});
    await addLog('Order placed',sku,`${qty} packs (${urgency})`);
    setMsg('ord-msg','✓ Order sent to Pune!',true);await loadInventory();render();
  });
  document.querySelectorAll('[data-action="approve"]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;b.textContent='Approving…';
    const id=b.dataset.id;const o=orders.find(x=>x.id==id);
    await sbPatch('orders',{id},{status:'approved'});
    await addLog('Order approved',o?.sku,`${o?.qty} packs approved`);await loadInventory();render();
  }));
  document.querySelectorAll('[data-action="reject"]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Reject this order?'))return;
    const id=b.dataset.id;const o=orders.find(x=>x.id==id);
    await sbPatch('orders',{id},{status:'rejected'});
    await addLog('Order rejected',o?.sku,`Rejected`);await loadInventory();render();
  }));
  document.querySelectorAll('[data-action="expand-dispatch"]').forEach(b=>b.addEventListener('click',()=>{expandedOrders.add(parseInt(b.dataset.id));render();}));
  document.querySelectorAll('[data-action="collapse"]').forEach(b=>b.addEventListener('click',()=>{expandedOrders.delete(parseInt(b.dataset.id));render();}));
  document.querySelectorAll('[data-action="do-dispatch"]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id,sku=b.dataset.sku,qty=parseInt(b.dataset.qty);
    const ref=document.getElementById(`dref-${id}`)?.value.trim()||'';
    const note=document.getElementById(`dnote-${id}`)?.value.trim()||'';
    b.disabled=true;b.textContent='Dispatching…';
    await sbPatch('orders',{id},{status:'dispatched',dispatched_ref:ref||null,dispatched_at:new Date().toISOString()});
    await sbPost('dispatches',{sku,qty,ref,note,dispatched_by:user});
    await addLog('Dispatched',sku,`${qty} packs sent to Mumbai`);
    expandedOrders.delete(parseInt(id));await loadInventory();render();
  }));
  document.querySelectorAll('[data-action="mark-delivered"]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id,sku=b.dataset.sku,qty=parseInt(b.dataset.qty);
    if(!confirm(`Mark delivered? Adds ${qty} packs of ${skuName(sku)} to Mumbai stock.`))return;
    b.disabled=true;b.textContent='Updating…';
    const cur=inv[sku]?.packs||0;
    await sbPatch('orders',{id},{status:'delivered',delivered_at:new Date().toISOString()});
    await sbPatch('inventory',{sku},{packs:cur+qty,updated_by:user});
    await addLog('Delivered',sku,`+${qty} packs. Stock: ${cur}→${cur+qty}`);await loadInventory();render();
  }));
}

function bindProductionEvents(){
  // RM save all
  document.getElementById('rm-save-all-btn')?.addEventListener('click',async()=>{
    const inputs=[...document.querySelectorAll('.rm-add-inp')].filter(i=>parseFloat(i.value)!==0&&i.value!=='');
    if(!inputs.length){setMsg('rm-save-msg','Nothing to save — enter qty to add.',false);return;}
    const btn=document.getElementById('rm-save-all-btn');btn.disabled=true;btn.textContent='Saving…';
    let saved=0;
    for(const inp of inputs){
      const id=parseInt(inp.dataset.id);
      const added=parseFloat(inp.value)||0;
      const current=parseFloat(inp.dataset.current)||0;
      const newTotal=current+added;
      const rm=rawMaterials.find(r=>r.id===id);
      await sbPatch('raw_materials',{id},{stock_qty:newTotal});
      await addLog('Stock updated',null,`${rm?.name}: +${added} → ${newTotal} ${rm?.unit}`);
      saved++;
    }
    rmDirty.clear();
    setMsg('rm-save-msg',`✓ ${saved} material${saved>1?'s':''} updated.`,true);
    btn.style.background='';btn.style.color='';btn.textContent='Save all';btn.disabled=false;
    await loadProduction();render();
  });
  // RM modal
  function openRMModal(rm){rmModalData=rm||null;rmModalOpen=true;render();setTimeout(()=>document.getElementById('rm-modal-name')?.focus(),50);}
  function closeRMModal(){rmModalOpen=false;rmModalData=null;render();}
  document.querySelector('[data-action="add-rm"]')?.addEventListener('click',()=>openRMModal(null));
  document.querySelectorAll('[data-action="edit-rm"]').forEach(b=>b.addEventListener('click',()=>{
    openRMModal(rawMaterials.find(r=>r.id==b.dataset.id));
  }));
  document.getElementById('rm-modal-overlay')?.addEventListener('click',e=>{if(e.target.id==='rm-modal-overlay')closeRMModal();});
  document.getElementById('rm-modal-close')?.addEventListener('click',closeRMModal);
  document.getElementById('rm-modal-del-btn')?.addEventListener('click',async()=>{
    const id=document.getElementById('rm-modal-id').value;
    const name=document.getElementById('rm-modal-name').value;
    if(!confirm(`Delete "${name}"?`))return;
    await sbDelete('raw_materials',{id});closeRMModal();await loadProduction();render();
  });
  document.getElementById('rm-modal-save-btn')?.addEventListener('click',async()=>{
    const id=document.getElementById('rm-modal-id').value;
    const name=document.getElementById('rm-modal-name').value.trim();
    const unit=document.getElementById('rm-modal-unit').value;
    const stock=parseFloat(document.getElementById('rm-modal-stock').value)||0;
    const thresh=parseFloat(document.getElementById('rm-modal-thresh').value)||0;
    const price=parseFloat(document.getElementById('rm-modal-price').value)||0;
    const supplier=document.getElementById('rm-modal-supplier').value.trim();
    if(!name){setMsg('rm-modal-msg','Name required.',false);return;}
    const btn=document.getElementById('rm-modal-save-btn');btn.disabled=true;btn.textContent='Saving…';
    if(id){await sbPatch('raw_materials',{id},{name,unit,stock_qty:stock,reorder_threshold:thresh,costing_price:price,supplier});}
    else{await sbPost('raw_materials',{name,unit,stock_qty:stock,reorder_threshold:thresh,costing_price:price,supplier});}
    closeRMModal();await loadProduction();render();
  });

  // Recipe form
  document.querySelector('[data-action="add-recipe"]')?.addEventListener('click',()=>{
    editingRecipe=null;recipeFormOpen=true;render();
    setTimeout(()=>{
      document.getElementById('recipe-form-card')?.scrollIntoView({behavior:'smooth'});
      initIngRows([]);initVarRows([]);
    },50);
  });
  document.querySelectorAll('[data-action="edit-recipe"]').forEach(b=>b.addEventListener('click',()=>{
    const r=recipes.find(x=>x.id===b.dataset.id);if(!r)return;
    editingRecipe=r;recipeFormOpen=true;render();
    setTimeout(()=>{
      document.getElementById('recipe-form-card')?.scrollIntoView({behavior:'smooth'});
      initIngRows(recipeIngredients.filter(i=>i.recipe_id===r.id));
      initVarRows(recipeVariants.filter(v=>v.recipe_id===r.id));
    },50);
  }));
  document.getElementById('recipe-cancel-btn')?.addEventListener('click',()=>{recipeFormOpen=false;editingRecipe=null;const el=document.getElementById('rec-id');if(el)el.disabled=false;render();});
  document.getElementById('add-ing-row')?.addEventListener('click',addIngRow);
  document.getElementById('add-var-row')?.addEventListener('click',addVarRow);
  document.getElementById('recipe-save-btn')?.addEventListener('click',saveRecipe);
  document.querySelectorAll('[data-action="del-recipe"]').forEach(b=>b.addEventListener('click',async()=>{
    const r=recipes.find(x=>x.id===b.dataset.id);
    if(!confirm(`Delete recipe "${r?.name}"?`))return;
    await sbDelete('recipe_ingredients',{recipe_id:b.dataset.id});
    await sbDelete('recipe_variants',{recipe_id:b.dataset.id});
    await sbDelete('recipes',{id:b.dataset.id});
    await loadProduction();render();
  }));
  document.querySelectorAll('[data-action="map-sku"]').forEach(sel=>sel.addEventListener('change',async()=>{
    const sku=sel.dataset.sku;const varId=sel.value?parseInt(sel.value):null;
    const existing=skuMap.find(m=>m.sku===sku);
    if(existing){if(varId)await sbPatch('sku_recipe_map',{sku},{recipe_variant_id:varId});else await sbDelete('sku_recipe_map',{sku});}
    else{if(varId)await sbPost('sku_recipe_map',{sku,recipe_variant_id:varId});}
    setMsg('map-msg','✓ Saved',true);await loadProduction();
    setTimeout(()=>{const el=document.getElementById('map-msg');if(el)el.textContent='';},2000);
  }));
  // Plan
  document.getElementById('plan-save-btn')?.addEventListener('click',async()=>{
    const recipe_id=document.getElementById('plan-recipe').value;
    const kg=parseFloat(document.getElementById('plan-kg').value);
    const date=document.getElementById('plan-date').value;
    if(!recipe_id){setMsg('plan-msg','Select a recipe.',false);return;}
    if(isNaN(kg)||kg<=0){setMsg('plan-msg','Enter valid kg.',false);return;}
    if(!date){setMsg('plan-msg','Select a date.',false);return;}
    await sbPost('production_plans',{recipe_id,planned_kg:kg,planned_date:date,status:'planned',created_by:user});
    setMsg('plan-msg','✓ Plan added.',true);await loadProduction();render();
  });
  document.querySelectorAll('[data-action="mark-plan-done"]').forEach(b=>b.addEventListener('click',async()=>{
    const planId=b.dataset.id;const plan=productionPlans.find(p=>p.id==planId);if(!plan)return;
    const ings=recipeIngredients.filter(i=>i.recipe_id===plan.recipe_id);
    const deductions=[];
    ings.forEach(ing=>{
      const rm=rawMaterials.find(r=>r.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm)return;
      deductions.push({rm,needed:ingQtyInRMUnit(ing.qty_per_kg,ing.unit,plan.planned_kg,rm.unit)});
    });
    const summary=deductions.map(d=>`${d.rm.name}: −${d.needed.toFixed(3)} ${d.rm.unit}`).join('\n');
    if(!confirm(`Mark production done?\n\nWill deduct:\n${summary}`))return;
    b.disabled=true;b.textContent='Saving…';
    for(const d of deductions){await sbPatch('raw_materials',{id:d.rm.id},{stock_qty:Math.max(0,(d.rm.stock_qty||0)-d.needed)});}
    await sbPatch('production_plans',{id:planId},{status:'done'});
    await addLog('Production done',null,`${plan.planned_kg}kg of ${plan.recipe_id}`);
    await loadProduction();render();
  }));
  document.querySelectorAll('[data-action="del-plan"]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Cancel this plan?'))return;
    await sbDelete('production_plans',{id:b.dataset.id});await loadProduction();render();
  }));
}

function bindBusinessEvents(){
  // Modals close
  document.getElementById('biz-product-modal')?.addEventListener('click',e=>{
    if(e.target.id==='biz-product-modal') document.getElementById('biz-product-modal').classList.remove('open');
  });
  document.getElementById('biz-close-modal')?.addEventListener('click',()=>{
    document.getElementById('biz-product-modal').classList.remove('open');
  });
  document.getElementById('biz-recipe-modal')?.addEventListener('click',e=>{
    if(e.target.id==='biz-recipe-modal') document.getElementById('biz-recipe-modal').classList.remove('open');
  });
  document.getElementById('biz-close-recipe-modal')?.addEventListener('click',()=>{
    document.getElementById('biz-recipe-modal').classList.remove('open');
  });
  document.getElementById('biz-recipe-save-btn')?.addEventListener('click',saveBizRecipeEdit);
  document.getElementById('biz-rec-add-ing')?.addEventListener('click',()=>{
    document.getElementById('biz-ing-rows').appendChild(makeBizIngRow('',''));
  });
  document.getElementById('biz-rec-add-size')?.addEventListener('click',()=>{
    document.getElementById('biz-size-rows').appendChild(makeBizSizeRow('',''));
  });
  document.getElementById('biz-rec-reset')?.addEventListener('click',()=>{
    if(!_bizEditId)return;
    if(!confirm('Reset to default recipe?'))return;
    if(bizState.customProducts)delete bizState.customProducts[_bizEditId];
    saveBizState();
    document.getElementById('biz-recipe-modal').classList.remove('open');
    render();showToast('Reset to default');
  });
}

function saveBizRecipeEdit(){
  if(!_bizEditId)return;
  const rm_formula={};
  document.querySelectorAll('#biz-ing-rows .ing-row').forEach(row=>{
    const sel=row.querySelector('select');
    const inp=row.querySelector('input[type="number"]');
    if(sel&&inp&&sel.value&&parseFloat(inp.value)>0) rm_formula[sel.value]=parseFloat(inp.value);
  });
  const dough_sizes=[];
  document.querySelectorAll('#biz-size-rows div').forEach(row=>{
    const inputs=row.querySelectorAll('input');
    const g=parseFloat(inputs[0]?.value);const s=inputs[1]?.value.trim();
    if(g>0&&s)dough_sizes.push({grams:g,inches:s});
  });
  const pack_default=parseInt(document.getElementById('biz-rec-pack').value)||10;
  if(!Object.keys(rm_formula).length){document.getElementById('biz-rec-msg').style.color='var(--red)';document.getElementById('biz-rec-msg').textContent='Add at least one ingredient.';return;}
  if(!dough_sizes.length){document.getElementById('biz-rec-msg').style.color='var(--red)';document.getElementById('biz-rec-msg').textContent='Add at least one size.';return;}
  if(!bizState.customProducts)bizState.customProducts={};
  bizState.customProducts[_bizEditId]={rm_formula,dough_sizes,pack_default};
  bizState._lastSaved=Date.now();
  saveBizState();
  document.getElementById('biz-recipe-modal').classList.remove('open');
  render();showToast('Recipe saved ✓');
}

// ============================================================
// RECIPE FORM HELPERS (production module)
// ============================================================
function initIngRows(ings){
  const c=document.getElementById('ing-rows');if(!c)return;
  c.innerHTML='';
  if(!ings.length)addIngRow();
  else ings.forEach(i=>addIngRow(i.ingredient_name,i.qty_per_kg,i.unit));
}
function addIngRow(name='',qty='',unit='g'){
  const c=document.getElementById('ing-rows');if(!c)return;
  const d=document.createElement('div');d.className='ing-row';
  const rmOpts=rawMaterials.map(r=>`<option value="${r.name}" ${r.name===name?'selected':''}>${r.name}</option>`).join('');
  d.innerHTML=`
    <select style="flex:2;min-width:0;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit">${rmOpts||`<option value="${name}">${name||'Select RM'}</option>`}</select>
    <input type="number" placeholder="qty/kg" value="${qty}" step="0.01" style="flex:1;min-width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit;text-align:right"/>
    <select style="flex:0 0 50px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit">${['g','ml','kg','litre','pcs'].map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}</select>
    <button class="btn btn-ghost" onclick="this.closest('.ing-row').remove()" style="padding:6px 8px;flex-shrink:0;font-size:12px">✕</button>`;
  c.appendChild(d);
}
function addVarRow(dough='',size='',pcs='',pack='',status='pending'){
  const c=document.getElementById('var-rows');if(!c)return;
  const d=document.createElement('div');d.className='ing-row';
  d.innerHTML=`
    <input type="number" placeholder="Dough(g)" value="${dough}" step="1" style="flex:1;min-width:60px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit;text-align:right"/>
    <input placeholder="Size (8 inch)" value="${size}" style="flex:2;min-width:80px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit"/>
    <input type="number" placeholder="pcs/kg" value="${pcs}" step="0.1" style="flex:1;min-width:55px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit;text-align:right"/>
    <input type="number" placeholder="Pack" value="${pack}" step="1" style="flex:1;min-width:50px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px;color:var(--text);font-size:12px;font-family:inherit;text-align:right"/>
    <button class="btn btn-ghost" onclick="this.closest('.ing-row').remove()" style="padding:6px 8px;flex-shrink:0;font-size:12px">✕</button>`;
  c.appendChild(d);
}
function initVarRows(vars){
  const c=document.getElementById('var-rows');if(!c)return;
  c.innerHTML='';
  if(!vars.length)addVarRow();
  else vars.forEach(v=>addVarRow(v.dough_ball_g,v.output_size,v.pieces_per_kg,v.pack_size_pieces,v.status));
}
async function saveRecipe(){
  const id=document.getElementById('rec-id').value.trim().toUpperCase();
  const name=document.getElementById('rec-name').value.trim();
  const product=document.getElementById('rec-product').value;
  const version=document.getElementById('rec-version').value.trim()||'1.0';
  const notes=document.getElementById('rec-notes').value.trim();
  if(!id||!name){setMsg('recipe-msg','Recipe ID and name are required.',false);return;}
  const ingRows=[...document.getElementById('ing-rows').querySelectorAll('.ing-row')];
  const ingredients=ingRows.map(row=>{
    const els=row.querySelectorAll('input,select');
    return{ingredient_name:els[0].value.trim(),qty_per_kg:parseFloat(els[1].value)||0,unit:els[2].value};
  }).filter(i=>i.ingredient_name&&i.qty_per_kg>0);
  const varRows=[...document.getElementById('var-rows').querySelectorAll('.ing-row')];
  const variants=varRows.map(row=>{
    const els=row.querySelectorAll('input');
    return{dough_ball_g:parseFloat(els[0].value)||0,output_size:els[1].value.trim(),pieces_per_kg:parseFloat(els[2].value)||0,pack_size_pieces:parseInt(els[3].value)||0,status:'approved'};
  }).filter(v=>v.dough_ball_g>0&&v.output_size);
  const btn=document.getElementById('recipe-save-btn');btn.disabled=true;btn.textContent='Saving…';
  if(editingRecipe){
    await sbPatch('recipes',{id},{name,product,version,notes});
    await sbDelete('recipe_ingredients',{recipe_id:id});
    await sbDelete('recipe_variants',{recipe_id:id});
  }else{
    await sbPost('recipes',{id,name,product,version,notes});
  }
  for(const ing of ingredients)await sbPost('recipe_ingredients',{recipe_id:id,...ing});
  for(const v of variants)await sbPost('recipe_variants',{recipe_id:id,...v});
  recipeFormOpen=false;editingRecipe=null;
  document.getElementById('rec-id').disabled=false;
  btn.disabled=false;btn.textContent='Save recipe';
  await loadProduction();render();showToast('Recipe saved ✓');
}

// ============================================================
// BOOT
// ============================================================
if(user){loadAll().then(()=>{render();startPolling();});}
else render();
</script>
