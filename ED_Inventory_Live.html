body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;font-size:14px;min-height:100vh}

.btn{cursor:pointer;padding:7px 14px;border-radius:8px;border:1px solid #ccc;background:transparent;color:#1a1a1a;font-size:13px;font-family:inherit}
.btn:hover{background:#f0ede6}.btn:active{transform:scale(0.98)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.danger-bar{background:#fcebeb;border:1px solid #f09595;border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:12px;color:#791f1f}

.step:first-child{border-radius:6px 0 0 6px}.step:last-child{border-radius:0 6px 6px 0}

.step.active{background:#e6f1fb;color:#0c447c;border-color:#85b7eb;font-weight:500}
.order-steps{display:flex;align-items:center;margin:10px 0}

/* ── SUPABASE ── */
const H=()=>({'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'});
async function sbGet(t,q=''){
  const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{headers:H()});
  if(!r.ok) return [];
  return r.json();
}
async function sbPost(t,body){
  const r=await fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...H(),'Prefer':'return=representation'},body:JSON.stringify(body)});
  return r.json();
}
async function sbPatch(t,match,body){
  const q=Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  const r=await fetch(`${SB}/rest/v1/${t}?${q}`,{method:'PATCH',headers:{...H(),'Prefer':'return=representation'},body:JSON.stringify(body)});
  return r.json();
}
async function sbDelete(t,match){
  const q=Object.entries(match).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join('&');
  await fetch(`${SB}/rest/v1/${t}?${q}`,{method:'DELETE',headers:H()});
}

async function loadMumbai(){

    sbGet('inventory',''),
    sbGet('orders','order=id.desc&limit=60'),
    sbGet('dispatches','order=id.desc&limit=40'),
    sbGet('activity_log','order=id.desc&limit=80'),
  ]);
  inv={}; (a||[]).forEach(r=>inv[r.sku]={packs:r.packs});
  orders=b||[]; dispatches=c||[]; actlog=d||[];
}

async function loadLocal(){
  const [a,b,c,d,e,f,g]=await Promise.all([

  ]);
  rawMaterials=a||[]; recipes=b||[]; recipeIngredients=c||[];
  recipeVariants=d||[]; skuMap=e||[]; rmPurchases=f||[]; productionPlans=g||[];
}

async function loadAll(){ await Promise.all([loadMumbai(), loadLocal()]); }
async function addLog(action,sku,detail){ await sbPost('activity_log',{action,sku,detail,done_by:user}); }

/* ── UTILS ── */
function skuName(id){return SKUS.find(s=>s.id===id)?.name||id;}
function ft(ts){return new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
function fd(d){return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function statusBadge(p){
  if(p<=CRIT) return `<span class="badge b-crit">Critical</span>`;
  if(p<=LOW)  return `<span class="badge b-low">Low</span>`;
  return `<span class="badge b-ok">OK</span>`;
}
function setMsg(id,txt,ok){const el=document.getElementById(id);if(!el)return;el.className=ok?'msg-ok':'msg-err';el.textContent=txt;}
function rupees(n){return '₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}

// Convert ingredient qty (recipe units: g or ml per kg batch) to RM stock unit
// Handles: g↔kg, ml↔litre, g→g (softener stored in g), ml→ml
function ingQtyInRMUnit(qty_per_kg, ing_unit, batch_kg, rm_unit){
  const raw = qty_per_kg * batch_kg; // total in recipe unit
  const ing = ing_unit?.toLowerCase();
  const rm  = rm_unit?.toLowerCase();
  if(ing === rm) return raw;                            // same unit — no conversion
  if(ing==='g'     && rm==='kg')     return raw/1000;  // g → kg
  if(ing==='kg'    && rm==='g')      return raw*1000;  // kg → g
  if(ing==='ml'    && rm==='litre')  return raw/1000;  // ml → litre
  if(ing==='litre' && rm==='ml')     return raw*1000;  // litre → ml
  if(ing==='g'     && rm==='litre')  return raw/1000;  // g → litre (edge case)
  if(ing==='ml'    && rm==='kg')     return raw/1000;  // ml → kg (edge case)
  return raw; // fallback — same scale assumed
}

/* ── RM ALARM ENGINE ── */
function computeRMNeeds(){
  // Returns array of {rmId, name, unit, needed, have, shortage}
  if(!rawMaterials.length||!recipes.length) return [];

  // Build ingredient→RM map
  const ingToRM={};
  // Direct match by name first
  rawMaterials.forEach(rm=>{ingToRM[rm.name.toLowerCase()]={rm,qty:rm.stock_qty};});

  // Collect demand: from pending/approved orders + planned production plans
  const demands=[]; // [{recipe_id, kg}]

  // From Mumbai orders
  orders.filter(o=>o.status==='pending'||o.status==='approved').forEach(o=>{
    const map=skuMap.find(m=>m.sku===o.sku);
    if(!map) return;
    const variant=recipeVariants.find(v=>v.id===map.recipe_variant_id);
    if(!variant||!variant.pieces_per_kg||!variant.pack_size_pieces) return;
    const totalPieces=o.qty*(variant.pack_size_pieces||1);
    const kgNeeded=totalPieces/variant.pieces_per_kg;
    demands.push({recipe_id:variant.recipe_id, kg:kgNeeded, source:`Order #${o.id} (${skuName(o.sku)})`});
  });

  // From production plans
  productionPlans.filter(p=>p.status==='planned').forEach(p=>{
    demands.push({recipe_id:p.recipe_id, kg:p.planned_kg, source:`Plan: ${p.planned_kg}kg ${p.recipe_id} on ${fd(p.planned_date)}`});
  });

  if(!demands.length) return [];

  // Aggregate RM needed
  const rmNeeded={}; // rmId -> {rm, needed, sources}
  demands.forEach(d=>{
    const ings=recipeIngredients.filter(i=>i.recipe_id===d.recipe_id);
    ings.forEach(ing=>{
      // Find RM by name match
      const rm=rawMaterials.find(r=>r.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm) return;
      const needed=ingQtyInRMUnit(ing.qty_per_kg, ing.unit, d.kg, rm.unit);
      if(!rmNeeded[rm.id]) rmNeeded[rm.id]={rm, needed:0, sources:[]};
      rmNeeded[rm.id].needed+=needed;
      rmNeeded[rm.id].sources.push(d.source);
    });
  });

  return Object.values(rmNeeded).map(x=>({
    ...x,
    shortage: x.needed > x.rm.stock_qty ? x.needed - x.rm.stock_qty : 0,
  })).filter(x=>x.shortage>0);
}

/* ── RENDER ROOT ── */
function render(){
  const app=document.getElementById('app');
  if(!user){app.innerHTML=renderLogin();bindLogin();return;}
  app.innerHTML=renderShell();
  bindShell();
}

/* ── LOGIN ── */
function renderLogin(){
  return `<div style="max-width:360px;margin:3rem auto">
  <div class="card">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:20px;font-weight:600">ED Operations</div>
      <div class="muted" style="margin-top:4px">Ethical Delights · Inventory & Production</div>
    </div>
    <label class="fl">Username</label>
    <input id="un" placeholder="Enter username" style="margin-bottom:10px" autocapitalize="none"/>
    <label class="fl">Password</label>
    <input id="pw" type="password" placeholder="Enter password" style="margin-bottom:16px"/>
    <button class="btn btn-primary" id="login-btn" style="width:100%;padding:10px">Sign in</button>
    <div id="login-err" style="color:#791f1f;font-size:12px;margin-top:8px;text-align:center"></div>
  </div>
</div>`;}
function bindLogin(){
  document.getElementById('un').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('pw').focus();});
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
  document.getElementById('login-btn').addEventListener('click',doLogin);
}
async function doLogin(){
  const un=document.getElementById('un').value.trim().toLowerCase();
  const pw=document.getElementById('pw').value;
  if(!USERS[un]||USERS[un].pw!==pw){document.getElementById('login-err').textContent='Incorrect username or password.';return;}
  const btn=document.getElementById('login-btn');
  btn.innerHTML='<span class="spinner"></span>Signing in…';btn.disabled=true;
  try{
    await loadAll();
    user=un;sessionStorage.setItem('ed_user',un);
    module=USERS[un].role==='mumbai'?'mumbai':'mumbai';
    activeTab='inventory';render();startPolling();
  }catch(e){
    document.getElementById('login-err').textContent='Could not connect. Check internet.';
    btn.innerHTML='Sign in';btn.disabled=false;
  }
}
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(!user){clearInterval(pollTimer);return;}
    await loadAll();
    // Don't re-render if user has unsaved RM edits — would wipe their inputs
    if(activeTab==='rm' && rmDirty.size>0) return;
    render();
  },20000);
}

/* ── SHELL ── */
function renderShell(){
  const u=USERS[user];
  const isPune=u.role==='pune';
  const alarms=computeRMNeeds();
  const pendingOrders=orders.filter(o=>o.status==='pending').length;
  const deliverPending=orders.filter(o=>o.status==='dispatched').length;
  const notif=isPune?pendingOrders:deliverPending;

  return `
<div class="hdr">
  <div>
    <span style="font-size:17px;font-weight:600">ED Operations</span>
    <span class="muted" style="margin-left:8px">${u.name} · ${u.loc}</span>
  </div>
  <div class="row">
    <span class="muted" id="sync-lbl">🟢 Live</span>
    <button class="btn btn-sm" id="refresh-btn">↻</button>
    <button class="btn btn-sm" id="logout-btn">Sign out</button>
  </div>
</div>

${isPune ? `<div class="mod-tabs">
  <button class="mod-tab ${module==='mumbai'?'active':''}" data-mod="mumbai">🚚 Mumbai Distributor</button>
  <button class="mod-tab ${module==='local'?'active':''}" data-mod="local">🏭 Local Production${alarms.length?` <span style="background:#fcebeb;color:#791f1f;border-radius:10px;padding:1px 6px;font-size:10px">${alarms.length}</span>`:''}</button>
</div>` : ''}

${module==='mumbai' ? renderMumbaiModule(isPune, notif) : renderLocalModule(alarms)}`;
}

function bindShell(){
  document.getElementById('logout-btn')?.addEventListener('click',()=>{
    user=null;sessionStorage.removeItem('ed_user');
    if(pollTimer)clearInterval(pollTimer);render();
  });
  document.getElementById('refresh-btn')?.addEventListener('click',async()=>{
    document.getElementById('sync-lbl').textContent='🔄 Syncing…';
    await loadAll();render();
  });
  document.querySelectorAll('.mod-tab').forEach(t=>t.addEventListener('click',()=>{
    module=t.dataset.mod;activeTab=module==='mumbai'?'inventory':'rm';render();
  }));
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    activeTab=t.dataset.tab;
    rmFormOpen=false; editingRM=null; purchaseFormOpen=null; rmDirty.clear();
    render();
  }));

  if(module==='mumbai') bindMumbai();
  else bindLocal();
}

/* ══════════════════════════════════════
   MUMBAI MODULE
══════════════════════════════════════ */
function renderMumbaiModule(isPune, notif){
  const lowAlerts=SKUS.filter(s=>(inv[s.id]?.packs||0)<=LOW);
  const dispatchPending=orders.filter(o=>o.status==='approved').length;

  return `
${lowAlerts.length?`<div class="alert-bar">⚠️ Low stock in Mumbai: ${lowAlerts.map(s=>s.name).join(', ')}</div>`:''}
${isPune&&dispatchPending>0?`<div class="info-bar">📦 ${dispatchPending} approved order${dispatchPending>1?'s':''} waiting to be dispatched</div>`:''}
${!isPune&&orders.filter(o=>o.status==='dispatched').length>0?`<div class="info-bar">🚚 Shipment on the way — mark as delivered when received</div>`:''}

<div class="tabs-row">
  <button class="tab ${activeTab==='inventory'?'active':''}" data-tab="inventory">📦 Inventory</button>
  <button class="tab ${activeTab==='orders'?'active':''}" data-tab="orders">📋 Orders${notif>0?` <span style="background:#f09595;color:#791f1f;border-radius:10px;padding:1px 6px;font-size:10px">${notif}</span>`:''}</button>
  <button class="tab ${activeTab==='log'?'active':''}" data-tab="log">🕒 Log</button>
</div>
${activeTab==='inventory'?renderMumbaiInventory(isPune):''}
${activeTab==='orders'?renderMumbaiOrders(isPune):''}
${activeTab==='log'?renderMumbaiLog():''}`;
}

function renderMumbaiInventory(isPune){
  const total=SKUS.reduce((a,s)=>a+(inv[s.id]?.packs||0),0);
  const crit=SKUS.filter(s=>(inv[s.id]?.packs||0)<=CRIT).length;
  const low=SKUS.filter(s=>(inv[s.id]?.packs||0)<=LOW&&(inv[s.id]?.packs||0)>CRIT).length;
  return `
<div class="g3" style="margin-bottom:14px">
  <div class="metric"><div class="lbl">Total packs (Mumbai)</div><div class="val">${total}</div></div>
  <div class="metric"><div class="lbl">Low / critical</div><div class="val">${low} / ${crit}</div></div>
  <div class="metric"><div class="lbl">Auto-refresh</div><div class="val" style="font-size:14px;padding-top:6px">Every 20s</div></div>
</div>
<div class="card" style="padding:.75rem 0">
  <div style="padding:0 1.25rem 8px"><span class="sec">Mumbai stock — all SKUs</span></div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th style="width:30%">SKU</th><th style="width:12%">Packs</th><th style="width:22%">Units</th><th style="width:16%">Status</th><th>Action</th></tr></thead>
    <tbody>${SKUS.map(s=>{
      const p=inv[s.id]?.packs||0;
      return `<tr>
        <td><strong style="font-weight:500">${s.name}</strong><br><span class="muted">${s.packSize} pcs/pack</span></td>
        <td style="font-weight:600">${p}</td><td class="muted">${(p*s.packSize).toLocaleString()} pcs</td>
        <td>${statusBadge(p)}</td>
        <td>${isPune
          ?`<button class="btn btn-sm" data-action="pune-adj" data-sku="${s.id}">Adjust</button>`
          :`<button class="btn btn-sm" data-action="mbai-set" data-sku="${s.id}">Set count</button>`}
        </td></tr>`;
    }).join('')}</tbody>
  </table></div>
</div>
${!isPune?`<div class="card">

function renderMumbaiOrders(isPune){
  const pending=orders.filter(o=>o.status==='pending');
  const approved=orders.filter(o=>o.status==='approved');
  const dispatched=orders.filter(o=>o.status==='dispatched');
  const done=orders.filter(o=>o.status==='delivered'||o.status==='rejected');

  function stepBar(st){
    const steps=['Ordered','Approved','Dispatched','Delivered'];
    const idx={pending:0,approved:1,dispatched:2,delivered:3,rejected:0}[st]||0;
    const rej=st==='rejected';
    return `<div class="order-steps">${steps.map((s,i)=>`<div class="step ${rej&&i===0?'active':i<idx?'done':i===idx?'active':''}">${i<idx?'✓ ':''}${s}</div>`).join('')}${rej?'<span class="muted" style="margin-left:8px">Rejected</span>':''}</div>`;
  }

  function oCard(o){
    const isExp=expandedOrders.has(o.id);
    const sku=SKUS.find(s=>s.id===o.sku);
    let act='';
    if(o.status==='pending'&&isPune) act=`<div class="row" style="margin-top:10px">
      <button class="btn btn-success btn-sm" data-action="approve" data-id="${o.id}">✓ Approve</button>
      <button class="btn btn-danger btn-sm" data-action="reject" data-id="${o.id}">✕ Reject</button></div>`;
    else if(o.status==='pending'&&!isPune) act=`<div class="muted" style="margin-top:8px">Awaiting Pune approval…</div>`;
    else if(o.status==='approved'&&isPune){
      act=isExp?`<div style="background:#f5f5f0;border-radius:8px;padding:12px;margin-top:10px">
        <div style="font-size:12px;font-weight:500;color:#0c447c;margin-bottom:8px">Record dispatch for this order</div>
        <div class="g2" style="margin-bottom:8px">
          <div><label class="fl">SKU</label><input value="${sku?.name}" disabled/></div>
          <div><label class="fl">Packs</label><input value="${o.qty}" disabled/></div>
        </div>
        <div class="g2" style="margin-bottom:8px">
          <div><label class="fl">Vehicle / batch ref</label><input id="dref-${o.id}" placeholder="MH12-AB-1234"/></div>
          <div><label class="fl">Note</label><input id="dnote-${o.id}" placeholder="Optional…"/></div>
        </div>
        <div class="row">
          <button class="btn btn-primary btn-sm" data-action="do-dispatch" data-id="${o.id}" data-sku="${o.sku}" data-qty="${o.qty}">🚚 Confirm dispatch</button>
          <button class="btn btn-sm" data-action="collapse" data-id="${o.id}">Cancel</button>
        </div>
        <div id="dmsg-${o.id}"></div>
      </div>`
      :`<div style="margin-top:10px"><button class="btn btn-primary btn-sm" data-action="expand-dispatch" data-id="${o.id}">🚚 Record dispatch</button></div>`;
    }
    else if(o.status==='approved'&&!isPune) act=`<div style="color:#0c447c;font-size:12px;margin-top:8px">✓ Approved — Pune is preparing dispatch</div>`;
    else if(o.status==='dispatched'&&!isPune) act=`<div style="margin-top:10px">
      <button class="btn btn-success btn-sm" data-action="mark-delivered" data-id="${o.id}" data-sku="${o.sku}" data-qty="${o.qty}">✓ Mark as delivered — update my stock</button></div>`;
    else if(o.status==='dispatched'&&isPune) act=`<div style="color:#3c3489;font-size:12px;margin-top:8px">🚚 Dispatched — waiting for Mumbai to confirm delivery</div>`;

    return `<div class="card" style="border-color:${o.urgency==='urgent'?'#f09595':o.status==='approved'?'#85b7eb':o.status==='dispatched'?'#afa9ec':'#e0ddd5'}">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px">
        <div><strong style="font-size:15px">${sku?.name||o.sku}</strong>
          <span class="badge b-${o.urgency==='urgent'?'urg':'norm'}" style="margin-left:6px">${o.urgency}</span>
          <span class="badge b-${o.status==='pending'?'pend':o.status==='approved'?'appr':o.status==='dispatched'?'disp':o.status==='delivered'?'delv':'rej'}" style="margin-left:4px">${o.status}</span>
        </div>
        <span class="muted">${ft(o.created_at)}</span>
      </div>
      <div class="muted" style="margin-bottom:6px"><strong style="color:#1a1a1a">${o.qty} packs</strong> · By: ${o.placed_by}${o.note?` · "${o.note}"`:''}</div>
      ${o.dispatched_ref?`<div class="muted">Ref: ${o.dispatched_ref}</div>`:''}
      ${stepBar(o.status)}${act}
    </div>`;
  }

  const active=[...pending,...approved,...dispatched];
  const hist=[...done];
  return `
${active.length===0&&hist.length===0?'<div class="card muted" style="text-align:center;padding:1.5rem">No orders yet.</div>':''}
${active.map(oCard).join('')}
${hist.length?`<div style="margin-top:4px"><div class="sec" style="margin-bottom:8px;color:#888">Completed</div>${hist.slice(0,15).map(oCard).join('')}</div>`:''}`;
}

function bindMumbai(){
  document.querySelectorAll('[data-action="pune-adj"]').forEach(b=>b.addEventListener('click',async()=>{
    const sku=b.dataset.sku,cur=inv[sku]?.packs||0;
    const v=prompt(`Adjust packs for ${skuName(sku)}\nCurrent: ${cur}\n\nEnter corrected count:`);
    if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0){alert('Invalid');return;}
    await sbPatch('inventory',{sku},{packs:n,updated_by:user});
    await addLog('Adjusted',sku,`${cur} → ${n} packs`);await loadMumbai();render();
  }));
  document.querySelectorAll('[data-action="mbai-set"]').forEach(b=>b.addEventListener('click',async()=>{
    const sku=b.dataset.sku,cur=inv[sku]?.packs||0;
    const v=prompt(`Set pack count for ${skuName(sku)}\nCurrent: ${cur}\n\nEnter actual packs on hand:`);
    if(v===null)return;const n=parseInt(v);if(isNaN(n)||n<0){alert('Invalid');return;}
    await sbPatch('inventory',{sku},{packs:n,updated_by:user});
    await addLog('Stock set',sku,`Set to ${n} packs (was ${cur})`);await loadMumbai();render();
  }));
  document.getElementById('ord-btn')?.addEventListener('click',async()=>{
    const sku=document.getElementById('ord-sku').value;
    const qty=parseInt(document.getElementById('ord-qty').value);
    const urgency=document.getElementById('ord-urgency').value;
    const note=document.getElementById('ord-note').value.trim();
    if(isNaN(qty)||qty<1){setMsg('ord-msg','Enter valid quantity.',false);return;}
    const btn=document.getElementById('ord-btn');btn.disabled=true;btn.textContent='Placing…';
    await sbPost('orders',{sku,qty,urgency,note,placed_by:user,status:'pending'});
    await addLog('Order placed',sku,`${qty} packs (${urgency})`);
    setMsg('ord-msg','✓ Order sent to Pune!',true);await loadMumbai();render();
  });
  document.querySelectorAll('[data-action="approve"]').forEach(b=>b.addEventListener('click',async()=>{
    b.disabled=true;b.textContent='Approving…';
    const id=b.dataset.id;
    await sbPatch('orders',{id},{status:'approved'});
    const o=orders.find(x=>x.id==id);
    await addLog('Order approved',o?.sku,`${o?.qty} packs approved, pending dispatch`);
    await loadMumbai();render();
  }));
  document.querySelectorAll('[data-action="reject"]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Reject this order?'))return;
    const id=b.dataset.id;
    await sbPatch('orders',{id},{status:'rejected'});
    const o=orders.find(x=>x.id==id);
    await addLog('Order rejected',o?.sku,`${o?.qty} packs rejected`);
    await loadMumbai();render();
  }));
  document.querySelectorAll('[data-action="expand-dispatch"]').forEach(b=>b.addEventListener('click',()=>{expandedOrders.add(parseInt(b.dataset.id));render();}));
  document.querySelectorAll('[data-action="collapse"]').forEach(b=>b.addEventListener('click',()=>{expandedOrders.delete(parseInt(b.dataset.id));render();}));
  document.querySelectorAll('[data-action="do-dispatch"]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id,sku=b.dataset.sku,qty=parseInt(b.dataset.qty);
    const ref=document.getElementById(`dref-${id}`)?.value.trim()||'';
    const note=document.getElementById(`dnote-${id}`)?.value.trim()||'';
    b.disabled=true;b.textContent='Dispatching…';
    await sbPatch('orders',{id},{status:'dispatched',dispatched_ref:ref||null,dispatched_at:new Date().toISOString()});
    await sbPost('dispatches',{sku,qty,ref,note,dispatched_by:user});
    await addLog('Dispatched',sku,`${qty} packs sent to Mumbai${ref?'. Ref: '+ref:''}`);
    expandedOrders.delete(parseInt(id));await loadMumbai();render();
  }));
  document.querySelectorAll('[data-action="mark-delivered"]').forEach(b=>b.addEventListener('click',async()=>{
    const id=b.dataset.id,sku=b.dataset.sku,qty=parseInt(b.dataset.qty);
    if(!confirm(`Mark delivered? This will add ${qty} packs of ${skuName(sku)} to Mumbai stock.`))return;
    b.disabled=true;b.textContent='Updating…';
    const cur=inv[sku]?.packs||0;
    await sbPatch('orders',{id},{status:'delivered',delivered_at:new Date().toISOString()});
    await sbPatch('inventory',{sku},{packs:cur+qty,updated_by:user});
    await addLog('Delivered',sku,`+${qty} packs. Mumbai stock: ${cur}→${cur+qty}`);
    await loadMumbai();render();
  }));
}

function renderPlanTab(){
  const active=productionPlans.filter(p=>p.status==='planned');
  const done=productionPlans.filter(p=>p.status==='done');
  return `

  <div class="sec" style="margin-bottom:12px">New production plan</div>
  <div class="g3" style="margin-bottom:8px">
    <div><label class="fl">Recipe</label>

</div>

${active.length===0?'<div class="card muted" style="text-align:center;padding:1.5rem">No planned production. Add one above.</div>':''}
${active.map(p=>{
  const r=recipes.find(x=>x.id===p.recipe_id);
  // Check RM for this plan
  const ings=recipeIngredients.filter(i=>i.recipe_id===p.recipe_id);
  const checks=ings.map(ing=>{
    const rm=rawMaterials.find(r=>r.name.toLowerCase()===ing.ingredient_name.toLowerCase());
    const needed=ingQtyInRMUnit(ing.qty_per_kg, ing.unit, p.planned_kg, rm?.unit||ing.unit);
    const have=rm?.stock_qty||0;
    const displayUnit=rm?.unit||ing.unit;
    return {name:ing.ingredient_name,needed,have,unit:displayUnit,ok:have>=needed};
  });
  const hasAlarm=checks.some(c=>!c.ok);
  return `<div class="card" style="border-color:${hasAlarm?'#f09595':'#97c459'}">
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
      <div>
        <strong>${r?.name||p.recipe_id}</strong>
        <span class="badge ${hasAlarm?'b-crit':'b-ok'}" style="margin-left:6px">${hasAlarm?'RM shortage':'Ready'}</span>
      </div>
      <span class="muted">${fd(p.planned_date)}</span>
    </div>
    <div class="muted" style="margin-bottom:8px">Planned: <strong style="color:#1a1a1a">${p.planned_kg} kg</strong> · By: ${p.created_by}</div>
    ${checks.length?`<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">
      ${checks.map(c=>`<span style="font-size:11px;padding:3px 8px;border-radius:6px;background:${c.ok?'#eaf3de':'#fcebeb'};color:${c.ok?'#27500a':'#791f1f'}">
        ${c.name}: need ${c.needed.toFixed(1)}${c.unit} / have ${c.have}${c.unit} ${c.ok?'✓':'✗'}
      </span>`).join('')}
    </div>`:''}
    <div class="row">
      <button class="btn btn-success btn-sm" data-action="mark-plan-done" data-id="${p.id}">✓ Mark done</button>
      <button class="btn btn-danger btn-sm" data-action="del-plan" data-id="${p.id}">✕ Cancel</button>
    </div>
  </div>`;
}).join('')}

${done.length?`<div class="card" style="padding:.75rem 0">
  <div style="padding:0 1.25rem 8px"><span class="sec">Completed plans</span></div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Recipe</th><th>Kg</th><th>Date</th><th>By</th></tr></thead>
    <tbody>${done.slice(0,20).map(p=>{const r=recipes.find(x=>x.id===p.recipe_id);return`<tr>
      <td>${r?.name||p.recipe_id}</td><td>${p.planned_kg}</td>
      <td class="muted">${fd(p.planned_date)}</td><td class="muted">${p.created_by}</td>
    </tr>`;}).join('')}</tbody>
  </table></div>
</div>`:''}`;
}

/* ── REPORT TAB ── */
function renderReportTab(alarms){
  const totalRMValue=rawMaterials.reduce((a,r)=>a+(r.stock_qty*r.price_per_unit),0);
  const totalSpent=rmPurchases.reduce((a,p)=>a+(p.total_cost||0),0);
  const spentByRM={};
  rmPurchases.forEach(p=>{
    if(!spentByRM[p.raw_material_id])spentByRM[p.raw_material_id]=0;
    spentByRM[p.raw_material_id]+=p.total_cost||0;
  });

  // What can we produce with current RM?
  const production=recipes.map(r=>{
    const ings=recipeIngredients.filter(i=>i.recipe_id===r.id);
    if(!ings.length) return null;
    let maxKg=Infinity;
    ings.forEach(ing=>{
      const rm=rawMaterials.find(x=>x.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm||!ing.qty_per_kg) return;
      // Convert: how many kg of batch can this RM stock support?
      // needed per kg batch = ingQtyInRMUnit(qty_per_kg, ing.unit, 1, rm.unit)
      const neededPerKg=ingQtyInRMUnit(ing.qty_per_kg, ing.unit, 1, rm.unit);
      const possible=rm.stock_qty/neededPerKg;
      if(possible<maxKg) maxKg=possible;
    });
    return {recipe:r,maxKg:maxKg===Infinity?0:maxKg};
  }).filter(Boolean);

  return `
<div class="g2" style="margin-bottom:14px">
  <div class="metric"><div class="lbl">Total RM stock value</div><div class="val" style="font-size:18px">${rupees(totalRMValue)}</div></div>
  <div class="metric"><div class="lbl">Total purchased (all time)</div><div class="val" style="font-size:18px">${rupees(totalSpent)}</div></div>
</div>

${alarms.length?`<div class="card">
  <div class="sec" style="margin-bottom:10px;color:#791f1f">⚠️ RM shortages — active orders & plans</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Raw material</th><th>Have</th><th>Need</th><th>Shortage</th></tr></thead>
    <tbody>${alarms.map(a=>`<tr class="alarm-row">
      <td><strong>${a.rm.name}</strong><br><span class="muted">${a.sources.slice(0,2).join(', ')}</span></td>
      <td>${a.rm.stock_qty} ${a.rm.unit}</td>
      <td class="rm-alarm">${a.needed.toFixed(2)} ${a.rm.unit}</td>
      <td class="rm-alarm"><strong>${a.shortage.toFixed(2)} ${a.rm.unit} short</strong></td>
    </tr>`).join('')}</tbody>
  </table></div>
</div>`:'<div class="success-bar">✓ All raw materials sufficient for active orders and production plans.</div>'}

<div class="card">
  <div class="sec" style="margin-bottom:10px">What can we produce right now?</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Recipe</th><th>Max kg producible</th></tr></thead>
    <tbody>${production.map(p=>`<tr>
      <td><strong>${p.recipe.id}</strong> — ${p.recipe.name}</td>
      <td ${p.maxKg<1?'class="rm-alarm"':p.maxKg>=5?'class="rm-ok"':''}>${p.maxKg.toFixed(1)} kg</td>
    </tr>`).join('')}
    ${production.length===0?'<tr><td colspan="2" class="muted">No recipes with ingredients mapped yet.</td></tr>':''}
    </tbody>
  </table></div>
</div>

<div class="card">
  <div class="sec" style="margin-bottom:10px">Spend by raw material</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Material</th><th>Unit</th><th>Current stock</th><th>Total spent</th></tr></thead>
    <tbody>${rawMaterials.map(r=>`<tr>
      <td><strong>${r.name}</strong></td>
      <td>${r.unit}</td>
      <td>${r.stock_qty}</td>
      <td>${rupees(spentByRM[r.id]||0)}</td>
    </tr>`).join('')}
    ${rawMaterials.length===0?'<tr><td colspan="4" class="muted">No materials yet.</td></tr>':''}
    </tbody>
  </table></div>
</div>

<div class="card">
  <div class="sec" style="margin-bottom:10px">Current stock snapshot</div>
  <div style="overflow-x:auto"><table>
    <thead><tr><th>Material</th><th>Stock</th><th>Reorder at</th><th>Value</th><th>Status</th></tr></thead>
    <tbody>${rawMaterials.map(r=>`<tr ${r.stock_qty<=r.reorder_threshold&&r.reorder_threshold>0?'class="alarm-row"':''}>
      <td><strong>${r.name}</strong></td>
      <td>${r.stock_qty} ${r.unit}</td>
      <td>${r.reorder_threshold} ${r.unit}</td>
      <td>${rupees(r.stock_qty*r.price_per_unit)}</td>
      <td>${r.stock_qty<=(r.reorder_threshold||0)&&r.reorder_threshold>0?'<span class="badge b-low">Reorder</span>':'<span class="badge b-ok">OK</span>'}</td>
    </tr>`).join('')}
    </tbody>
  </table></div>
</div>`;}

/* ── LOCAL BINDINGS ── */
function bindLocal(){
  // RM add/edit
  document.querySelector('[data-action="add-rm"]')?.addEventListener('click',()=>{
    editingRM=null; rmFormOpen=true; purchaseFormOpen=null;
    render();
    setTimeout(()=>document.getElementById('rm-form-card')?.scrollIntoView({behavior:'smooth'}),50);
  });
  document.querySelectorAll('[data-action="edit-rm"]').forEach(b=>b.addEventListener('click',()=>{
    const rm=rawMaterials.find(r=>r.id==b.dataset.id);if(!rm)return;
    editingRM=rm; rmFormOpen=true; purchaseFormOpen=null;
    render();
    setTimeout(()=>document.getElementById('rm-form-card')?.scrollIntoView({behavior:'smooth'}),50);
  }));
  document.getElementById('rm-cancel-btn')?.addEventListener('click',()=>{rmFormOpen=false;editingRM=null;render();});
  document.getElementById('rm-save-btn')?.addEventListener('click',async()=>{
    const name=document.getElementById('rm-name').value.trim();
    const unit=document.getElementById('rm-unit').value;
    const thresh=parseFloat(document.getElementById('rm-thresh').value)||0;
    if(!name){setMsg('rm-msg','Name is required.',false);return;}
    const btn=document.getElementById('rm-save-btn');btn.disabled=true;btn.textContent='Saving…';
    if(editingRM){
      await sbPatch('raw_materials',{id:editingRM.id},{name,unit,reorder_threshold:thresh});
    }else{
      await sbPost('raw_materials',{name,unit,stock_qty:0,reorder_threshold:thresh,price_per_unit:0});
    }
    rmFormOpen=false;editingRM=null;
    await loadLocal();render();
  });
  document.querySelectorAll('[data-action="del-rm"]').forEach(b=>b.addEventListener('click',async()=>{
    const rm=rawMaterials.find(r=>r.id==b.dataset.id);
    if(!confirm(`Delete "${rm?.name}"? This cannot be undone.`))return;
    await sbDelete('raw_materials',{id:b.dataset.id});
    await loadLocal();render();
  }));

  // Save all RM stock changes at once
  document.getElementById('rm-save-all-btn')?.addEventListener('click',async()=>{
    const inputs=[...document.querySelectorAll('.rm-qty-input')];
    const changed=inputs.filter(i=>rmDirty.has(parseInt(i.dataset.id)));
    if(changed.length===0){
      const msg=document.getElementById('rm-save-msg');
      if(msg){msg.style.color='#666';msg.textContent='No changes to save.';}
      return;
    }
    const btn=document.getElementById('rm-save-all-btn');
    btn.disabled=true;btn.textContent='Saving…';

    let saved=0;
    for(const input of changed){
      const id=parseInt(input.dataset.id);
      const n=parseFloat(input.value);
      if(isNaN(n)||n<0) continue;
      const rm=rawMaterials.find(r=>r.id===id);
      const old=rm?.stock_qty||0;
      await sbPatch('raw_materials',{id},{stock_qty:n});
      await addLog('Stock updated',null,`${rm?.name}: ${old}→${n} ${rm?.unit} (bulk edit)`);
      input.style.borderColor='#97c459'; // green = saved
      saved++;
    }

    rmDirty.clear();
    const msg=document.getElementById('rm-save-msg');
    if(msg){msg.style.color='#3b6d11';msg.textContent=`✓ ${saved} item${saved>1?'s':''} saved successfully.`;}
    btn.style.background='';btn.style.borderColor='';btn.style.color='';
    btn.textContent='✓ Save all changes';btn.disabled=false;

    await loadLocal();
    // Only re-render after save — now rmDirty is clear so it's safe
    render();
  });

  // Recipe add/edit
  document.querySelector('[data-action="add-recipe"]')?.addEventListener('click',()=>{
    editingRecipe=null;
    document.getElementById('recipe-form-title').textContent='Add recipe';
    ['rec-id','rec-name','rec-version','rec-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    document.getElementById('rec-product').value='Chapati';
    initIngRows([]); initVarRows([]);
    document.getElementById('recipe-form-card').style.display='block';
    document.getElementById('recipe-form-card').scrollIntoView({behavior:'smooth'});
  });
  document.querySelectorAll('[data-action="edit-recipe"]').forEach(b=>b.addEventListener('click',()=>{
    const r=recipes.find(x=>x.id===b.dataset.id);if(!r)return;
    editingRecipe=r;
    document.getElementById('recipe-form-title').textContent='Edit — '+r.name;
    document.getElementById('rec-id').value=r.id;document.getElementById('rec-id').disabled=true;
    document.getElementById('rec-name').value=r.name;
    document.getElementById('rec-product').value=r.product;
    document.getElementById('rec-version').value=r.version||'1.0';
    document.getElementById('rec-notes').value=r.notes||'';
    initIngRows(recipeIngredients.filter(i=>i.recipe_id===r.id));
    initVarRows(recipeVariants.filter(v=>v.recipe_id===r.id));
    document.getElementById('recipe-form-card').style.display='block';
    document.getElementById('recipe-form-card').scrollIntoView({behavior:'smooth'});
  }));
  document.getElementById('recipe-cancel-btn')?.addEventListener('click',()=>{
    document.getElementById('recipe-form-card').style.display='none';editingRecipe=null;
    const idEl=document.getElementById('rec-id');if(idEl)idEl.disabled=false;
  });
  document.getElementById('add-ing-row')?.addEventListener('click',()=>{addIngRow();});
  document.getElementById('add-var-row')?.addEventListener('click',()=>{addVarRow();});
  document.getElementById('recipe-save-btn')?.addEventListener('click',saveRecipe);
  document.querySelectorAll('[data-action="del-recipe"]').forEach(b=>b.addEventListener('click',async()=>{
    const r=recipes.find(x=>x.id===b.dataset.id);
    if(!confirm(`Delete recipe "${r?.name}"?`))return;
    await sbDelete('recipe_ingredients',{recipe_id:b.dataset.id});
    await sbDelete('recipe_variants',{recipe_id:b.dataset.id});
    await sbDelete('recipes',{id:b.dataset.id});
    await loadLocal();render();
  }));

  // SKU map
  document.querySelectorAll('[data-action="map-sku"]').forEach(sel=>sel.addEventListener('change',async()=>{
    const sku=sel.dataset.sku;
    const varId=sel.value?parseInt(sel.value):null;
    const existing=skuMap.find(m=>m.sku===sku);
    if(existing){
      if(varId) await sbPatch('sku_recipe_map',{sku},{recipe_variant_id:varId});
      else await sbDelete('sku_recipe_map',{sku});
    }else{
      if(varId) await sbPost('sku_recipe_map',{sku,recipe_variant_id:varId});
    }
    setMsg('map-msg','✓ Mapping saved.',true);
    await loadLocal();
    setTimeout(()=>{const el=document.getElementById('map-msg');if(el)el.textContent='';},2000);
  }));

  // Production plan
  document.getElementById('plan-save-btn')?.addEventListener('click',async()=>{
    const recipe_id=document.getElementById('plan-recipe').value;
    const kg=parseFloat(document.getElementById('plan-kg').value);
    const date=document.getElementById('plan-date').value;
    if(!recipe_id){setMsg('plan-msg','Select a recipe.',false);return;}
    if(isNaN(kg)||kg<=0){setMsg('plan-msg','Enter valid kg.',false);return;}
    if(!date){setMsg('plan-msg','Select a date.',false);return;}
    await sbPost('production_plans',{recipe_id,planned_kg:kg,planned_date:date,status:'planned',created_by:user});
    setMsg('plan-msg','✓ Plan added.',true);
    await loadLocal();render();
  });
  document.querySelectorAll('[data-action="mark-plan-done"]').forEach(b=>b.addEventListener('click',async()=>{
    const planId = b.dataset.id;
    const plan   = productionPlans.find(p=>p.id==planId);
    if(!plan) return;

    // Calculate RM deductions
    const ings = recipeIngredients.filter(i=>i.recipe_id===plan.recipe_id);
    const deductions = [];
    ings.forEach(ing=>{
      const rm = rawMaterials.find(r=>r.name.toLowerCase()===ing.ingredient_name.toLowerCase());
      if(!rm) return;
      const needed = ingQtyInRMUnit(ing.qty_per_kg, ing.unit, plan.planned_kg, rm.unit);
      deductions.push({rm, needed});
    });

    // Show confirmation with deduction summary
    const summary = deductions.map(d=>`${d.rm.name}: −${d.needed.toFixed(3)} ${d.rm.unit}`).join('\n');
    if(!confirm(`Mark production complete?\n\nThis will deduct from raw material stock:\n\n${summary}\n\nContinue?`)) return;

    b.disabled=true; b.textContent='Saving…';

    // Deduct each RM
    for(const d of deductions){
      const newQty = Math.max(0, (d.rm.stock_qty||0) - d.needed);
      await sbPatch('raw_materials',{id:d.rm.id},{stock_qty:newQty});
    }

    await sbPatch('production_plans',{id:planId},{status:'done'});
    await addLog('Production done', null, `${plan.planned_kg}kg of ${plan.recipe_id} — ${deductions.length} RMs deducted`);
    await loadLocal(); render();
  }));
  document.querySelectorAll('[data-action="del-plan"]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Cancel this production plan?'))return;
    await sbDelete('production_plans',{id:b.dataset.id});
    await loadLocal();render();
  }));
}

/* ── RECIPE FORM HELPERS ── */
function initIngRows(ings){
  const c=document.getElementById('ing-rows');if(!c)return;
  c.innerHTML='';
  if(ings.length===0){addIngRow();}
  else ings.forEach(i=>addIngRow(i.ingredient_name,i.qty_per_kg,i.unit));
}
function addIngRow(name='',qty='',unit='g'){
  const c=document.getElementById('ing-rows');if(!c)return;
  const d=document.createElement('div');d.className='ing-row';
  const rmOptions=rawMaterials.map(r=>`<option value="${r.name}" ${r.name===name?'selected':''}>${r.name}</option>`).join('');
  d.innerHTML=`
    <select style="flex:2">${rmOptions?`<option value="">Select RM…</option>${rmOptions}`:`<option value="${name}">${name||'Type name'}</option>`}</select>
    <input type="number" placeholder="qty/kg" value="${qty}" style="flex:1;min-width:70px" step="0.01"/>
    <select style="flex:1;min-width:60px">
      ${['g','ml','kg','litre','pcs'].map(u=>`<option ${u===unit?'selected':''}>${u}</option>`).join('')}
    </select>
    <button class="btn btn-danger btn-sm" onclick="this.closest('.ing-row').remove()">✕</button>`;
  c.appendChild(d);
}
function addVarRow(dough='',size='',pcs='',pack='',status='pending'){
  const c=document.getElementById('var-rows');if(!c)return;
  const d=document.createElement('div');d.className='ing-row';
  d.innerHTML=`
    <input type="number" placeholder="Dough ball (g)" value="${dough}" style="flex:1;min-width:80px" step="1"/>
    <input placeholder="Output size (e.g. 8 inch)" value="${size}" style="flex:1;min-width:90px"/>
    <input type="number" placeholder="Pcs/kg" value="${pcs}" style="flex:1;min-width:70px" step="0.1"/>
    <input type="number" placeholder="Pack size (pcs)" value="${pack}" style="flex:1;min-width:80px" step="1"/>
    <select style="flex:1;min-width:80px"><option ${status==='pending'?'selected':''}>pending</option><option ${status==='approved'?'selected':''}>approved</option></select>
    <button class="btn btn-danger btn-sm" onclick="this.closest('.ing-row').remove()">✕</button>`;
  c.appendChild(d);
}
function initVarRows(vars){
  const c=document.getElementById('var-rows');if(!c)return;
  c.innerHTML='';
  if(vars.length===0){addVarRow();}
  else vars.forEach(v=>addVarRow(v.dough_ball_g,v.output_size,v.pieces_per_kg,v.pack_size_pieces,v.status));
}
async function saveRecipe(){
  const id=document.getElementById('rec-id').value.trim().toUpperCase();
  const name=document.getElementById('rec-name').value.trim();
  const product=document.getElementById('rec-product').value;
  const version=document.getElementById('rec-version').value.trim()||'1.0';
  const notes=document.getElementById('rec-notes').value.trim();
  if(!id||!name){setMsg('recipe-msg','Recipe ID and name are required.',false);return;}

  const ingRows=[...document.getElementById('ing-rows').querySelectorAll('.ing-row')];
  const ingredients=ingRows.map(row=>{
    const els=row.querySelectorAll('input,select');
    return {ingredient_name:els[0].value.trim(),qty_per_kg:parseFloat(els[1].value)||0,unit:els[2].value};
  }).filter(i=>i.ingredient_name&&i.qty_per_kg>0);

  const varRows=[...document.getElementById('var-rows').querySelectorAll('.ing-row')];
  const variants=varRows.map(row=>{
    const els=row.querySelectorAll('input,select');
    return {dough_ball_g:parseFloat(els[0].value)||0,output_size:els[1].value.trim(),pieces_per_kg:parseFloat(els[2].value)||0,pack_size_pieces:parseInt(els[3].value)||0,status:els[4].value};
  }).filter(v=>v.dough_ball_g>0&&v.output_size);

  const btn=document.getElementById('recipe-save-btn');btn.disabled=true;btn.textContent='Saving…';

  if(editingRecipe){
    await sbPatch('recipes',{id},{name,product,version,notes});
    await sbDelete('recipe_ingredients',{recipe_id:id});
    await sbDelete('recipe_variants',{recipe_id:id});
  }else{
    await sbPost('recipes',{id,name,product,version,notes});
  }
  for(const ing of ingredients) await sbPost('recipe_ingredients',{recipe_id:id,...ing});
  for(const v of variants) await sbPost('recipe_variants',{recipe_id:id,...v});

  document.getElementById('recipe-form-card').style.display='none';
  document.getElementById('rec-id').disabled=false;
  editingRecipe=null;btn.disabled=false;btn.textContent='Save recipe';
  await loadLocal();render();
}

/* ── BOOT ── */
if(user){loadAll().then(()=>{render();startPolling();});}
else render();
</script>
