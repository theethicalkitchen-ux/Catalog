<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ethical Delights — Recipe Manager</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAF7F2;color:#2C2420;min-height:100vh}
.topbar{background:#2C2420;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.brand-sub{color:#D4841A;font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.brand-main{color:#fff;font-size:15px;font-weight:700}
.btn-primary{background:#D4841A;border:none;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:700}
.btn-secondary{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:12px}
.main{padding:16px;max-width:600px;margin:0 auto}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid #EDE8DF;border-radius:10px;padding:12px}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#B5AA9A}
.stat-val{font-size:20px;font-weight:700;color:#7A3B1E;margin-top:2px}
.filter-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filter-btn{padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #EDE8DF;background:#fff;color:#2C2420;white-space:nowrap;font-weight:500}
.filter-btn.active{background:#7A3B1E;color:#fff;border-color:#7A3B1E}
.recipe-card{background:#fff;border:1px solid #EDE8DF;border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.badge{background:#F5E6CC;color:#D4841A;border:1px solid #D4841A;border-radius:4px;padding:2px 7px;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.recipe-id{font-size:11px;color:#B5AA9A;font-weight:600;margin-left:6px}
.recipe-name{font-size:14px;font-weight:700;color:#2C2420;margin-top:4px}
.recipe-meta{font-size:11px;color:#B5AA9A;margin-top:2px}
.empty{text-align:center;padding:50px 20px;background:#fff;border:1px solid #EDE8DF;border-radius:12px}
.view-header{background:#7A3B1E;border-radius:12px;padding:18px 16px;margin-bottom:16px;color:#fff}
.view-product{font-size:9px;letter-spacing:.12em;opacity:.65;text-transform:uppercase;margin-bottom:4px}
.view-name{font-size:18px;font-weight:700}
.view-meta{font-size:11px;opacity:.5;margin-top:4px}
.batch-wrap{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.batch-btn{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;border:1px solid #EDE8DF;background:#fff;color:#2C2420}
.batch-btn.active{border:2px solid #D4841A;background:#F5E6CC;color:#D4841A}
.sec{display:flex;align-items:center;gap:8px;margin:18px 0 10px}
.sec-line{height:2px;width:14px;background:#D4841A;border-radius:2px}
.sec-text{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#7A3B1E}
.sec-rule{height:1px;flex:1;background:#EDE8DF}
.ing-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #EDE8DF}
.ing-label{font-size:13px;color:#2C2420}
.ing-val{font-size:13px;font-weight:700;color:#7A3B1E;text-align:right}
.mach-val{color:#4A5E40}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg-card{background:#EDE8DF;border-radius:8px;padding:10px 12px}
.pkg-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#B5AA9A}
.pkg-val{font-size:14px;font-weight:700;color:#2C2420;margin-top:2px}
.notes-box{background:#EDE8DF;border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:#2C2420}
.info-banner{background:#F5E6CC;border-radius:8px;padding:8px 12px;font-size:12px;color:#7A3B1E;margin-bottom:12px}
.share-box{background:#EDE8DF;border-radius:10px;padding:14px;font-size:12px;line-height:1.8;white-space:pre-wrap;font-family:monospace;color:#2C2420;word-break:break-word}
.btn-full{width:100%;padding:13px;border-radius:10px;border:none;cursor:pointer;font-size:14px;font-weight:700;margin-top:12px}
.btn-dark{background:#2C2420;color:#fff}
.btn-ember{background:#7A3B1E;color:#fff}
.btn-moss{background:#4A5E40;color:#fff}
.form-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#B5AA9A;margin-bottom:4px;display:block}
.form-input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #EDE8DF;background:#fff;font-size:13px;color:#2C2420;outline:none;-webkit-appearance:none}
.form-input:focus{border-color:#D4841A}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row{margin-bottom:14px}
.form-error{font-size:11px;color:#B03A2E;margin-top:3px}
.form-check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.form-check input{width:18px;height:18px;accent-color:#D4841A}
.section-card{background:#fff;border:1px solid #EDE8DF;border-radius:10px;padding:14px;margin-bottom:12px}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:320px;width:100%}
.confirm-title{font-size:16px;font-weight:700;color:#2C2420;margin-bottom:8px}
.confirm-msg{font-size:13px;color:#B5AA9A;margin-bottom:20px;line-height:1.5}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#4A5E40;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
/* Sizing table */
.size-table{width:100%;border-collapse:collapse;margin-top:4px}
.size-table th{background:#EDE8DF;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7A3B1E;padding:8px 10px;text-align:center}
.size-table td{font-size:13px;padding:8px 10px;text-align:center;border-bottom:1px solid #EDE8DF}
.size-table tr:last-child td{border-bottom:none}
.size-table td.approved{color:#4A5E40;font-weight:700}
.size-table td.pending{color:#D4841A}
.status-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pill-pending{background:#FFF3DC;color:#D4841A;border:1px solid #D4841A}
.pill-approved{background:#E8EDE6;color:#4A5E40;border:1px solid #4A5E40}
.pill-testing{background:#EAF2FB;color:#1A5276;border:1px solid #1A5276}
.size-row-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.btn-remove{background:#FDECEA;border:1px solid #E74C3C;color:#E74C3C;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:12px;font-weight:700}
.btn-add-size{background:#E8EDE6;border:1px solid #4A5E40;color:#4A5E40;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px;font-weight:700;width:100%;margin-top:4px}
.water-temp-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.temp-lukewarm{background:#FFF3DC;color:#D4841A}
.temp-cold{background:#EAF2FB;color:#1A5276}
.temp-hot{background:#FDECEA;color:#C0392B}
.temp-room{background:#EDE8DF;color:#2C2420}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand-sub">Ethical Delights</div>
    <div class="brand-main">Recipe Manager</div>
  </div>
  <div id="topbar-btn"></div>
</div>

<div class="main" id="main"></div>
<div class="toast" id="toast"></div>
<div id="confirm-overlay"></div>

<script>
const PRODUCTS = ["Chapati","Puri","Bhature","Dal Pakwan","Wrap"];
const PLATE_SIZES = ["1.00","1.25","1.50","1.75","2.00","2.25","2.50","2.75","3.00"];
const WATER_TEMPS = ["Luke Warm","Cold","Hot","Room Temperature","Not Applicable"];
const SIZE_STATUSES = ["Pending Test","Approved","In Testing"];
const BATCHES = [0.5,1,2,3,4,5];

let recipes = JSON.parse(localStorage.getItem("ed_recipes_v2") || "null") || [
  {
    id:"CH-001", name:"Aloo Chapati — Siddhikala Wheat", product:"Chapati",
    version:"1.0", date:"2026-06-11",
    ingredients:[
      {label:"Whole Wheat (Siddhikala)",value:1000,unit:"g"},
      {label:"Oil",value:50,unit:"ml"},
      {label:"Salt",value:6,unit:"g"},
      {label:"Softener / Enzyme Powder",value:0.3,unit:"g"},
      {label:"Aloo Flakes",value:50,unit:"g"},
    ],
    water:{qty:1000,temp:"Hot"},
    machine:[
      {label:"Pressure",value:8,unit:"PSI"},
      {label:"Press Time",value:1,unit:"sec"},
      {label:"Plate / Stopper",value:"1.25",unit:"mm"},
      {label:"Temperature",value:"",unit:"°C"},
      {label:"Resting Time",value:30,unit:"min"},
    ],
    sizingTable:[
      {dough:50,output:"7 inches",status:"Approved"}
    ],
    packaging:{coolingTime:"",butterPaper:true,dusting:true,storage:"deepFreeze"},
    notes:"Trial (11 Jun 2026): Softer, very less chewy, stayed softer for longer."
  },
  {
    id:"BH-001", name:"Bhature — Maida Rava Curd", product:"Bhature",
    version:"1.0", date:"2026-06-17",
    ingredients:[
      {label:"Maida",value:500,unit:"g"},
      {label:"Rava",value:200,unit:"g"},
      {label:"Curd",value:100,unit:"g"},
      {label:"Baking Soda",value:2,unit:"g"},
      {label:"Baking Powder",value:3,unit:"g"},
      {label:"Butter",value:25,unit:"g"},
      {label:"Sugar",value:10,unit:"g"},
      {label:"Salt",value:10,unit:"g"},
      {label:"Corn Dexgel",value:10,unit:"g"},
    ],
    water:{qty:100,temp:"Luke Warm"},
    machine:[
      {label:"Pressure",value:5,unit:"PSI"},
      {label:"Press Time",value:1.2,unit:"sec"},
      {label:"Plate / Stopper",value:"1.00",unit:"mm"},
      {label:"Temperature",value:"120 / 140",unit:"°C"},
      {label:"Resting Time",value:30,unit:"min"},
    ],
    sizingTable:[
      {dough:50,output:"7 inches",status:"Pending Test"},
      {dough:40,output:"6.5 inches",status:"Pending Test"},
      {dough:35,output:"6 inches",status:"Pending Test"},
    ],
    packaging:{coolingTime:"",butterPaper:false,dusting:false,storage:"deepFreeze"},
    notes:"Trial (17 Jun 2026): All sizes puff well at 5 PSI / 1.2 press time. Team to test all three dough sizes before mass production."
  }
];

let view="list", selId=null, filterProd="All", batchQty=1;

function save(){ localStorage.setItem("ed_recipes_v2", JSON.stringify(recipes)); }
function scale(v,m){ if(v===""||v===null||v===undefined||v==="")return"—"; const n=parseFloat(v); if(isNaN(n))return v; return parseFloat((n*m).toFixed(2)); }
function batchLbl(q){ return q===0.5?"½ kg":q+" kg"; }
function esc(s){ return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function confirm2(title,msg,onYes){
  document.getElementById("confirm-overlay").innerHTML=`<div class="confirm-overlay" onclick="closeConfirm()"><div class="confirm-box" onclick="event.stopPropagation()"><div class="confirm-title">${esc(title)}</div><div class="confirm-msg">${esc(msg)}</div><div class="confirm-btns"><button class="btn-full" style="margin-top:0;background:#fff;border:1px solid #EDE8DF;color:#2C2420" onclick="closeConfirm()">Cancel</button><button class="btn-full btn-ember" style="margin-top:0" onclick="closeConfirm();(${onYes.toString()})()">Delete</button></div></div></div>`;
}
function closeConfirm(){ document.getElementById("confirm-overlay").innerHTML=""; }

function waterTempClass(t){
  if(t==="Luke Warm") return "temp-lukewarm";
  if(t==="Cold") return "temp-cold";
  if(t==="Hot") return "temp-hot";
  return "temp-room";
}

function render(){
  const main=document.getElementById("main");
  const tb=document.getElementById("topbar-btn");

  if(view==="list"){
    tb.innerHTML=`<button class="btn-primary" onclick="showAdd()">+ New</button>`;
    const counts={}; PRODUCTS.forEach(p=>counts[p]=recipes.filter(r=>r.product===p).length);
    const filtered=recipes.filter(r=>filterProd==="All"||r.product===filterProd);
    const latest=recipes.length?recipes[recipes.length-1].id:"—";
    main.innerHTML=`
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Recipes</div><div class="stat-val">${recipes.length}</div></div>
        <div class="stat-card"><div class="stat-label">Products</div><div class="stat-val">${PRODUCTS.filter(p=>counts[p]>0).length}</div></div>
        <div class="stat-card"><div class="stat-label">Latest</div><div class="stat-val" style="font-size:14px;margin-top:6px">${esc(latest)}</div></div>
      </div>
      <div class="filter-wrap">
        ${["All",...PRODUCTS].map(p=>`<button class="filter-btn ${filterProd===p?"active":""}" onclick="setFilter('${p}')">${esc(p)}${p!=="All"&&counts[p]>0?" ("+counts[p]+")":""}</button>`).join("")}
      </div>
      ${filtered.length===0
        ?`<div class="empty"><div style="font-size:32px;margin-bottom:12px">🫓</div><div style="font-size:15px;font-weight:700">${recipes.length===0?"No recipes yet":"No recipes for this filter"}</div><div style="font-size:13px;color:#B5AA9A;margin-top:6px">Tap "+ New" to add your first recipe.</div></div>`
        :filtered.map(r=>`
          <div class="recipe-card" onclick="viewRecipe('${esc(r.id)}')">
            <div style="flex:1">
              <div style="display:flex;align-items:center">
                <span class="badge">${esc(r.product)}</span>
                <span class="recipe-id">${esc(r.id)}</span>
              </div>
              <div class="recipe-name">${esc(r.name)}</div>
              <div class="recipe-meta">v${esc(r.version)} · ${esc(r.date)} · ${r.packaging.storage==="deepFreeze"?"❄ Deep Freeze":"🌡 Refrigeration"}${r.sizingTable&&r.sizingTable.length>0?" · "+r.sizingTable.length+" sizes":""}</div>
            </div>
            <div style="color:#D4841A;font-size:20px;padding-left:8px">›</div>
          </div>`).join("")}
    `;
  }

  else if(view==="view"){
    const r=recipes.find(x=>x.id===selId); if(!r){view="list";render();return;}
    tb.innerHTML=`<button class="btn-secondary" onclick="goList()">← Back</button>`;
    const ings=r.ingredients.filter(i=>i.value!==""&&i.value!==null).map(i=>`
      <div class="ing-row">
        <span class="ing-label">${esc(i.label)}</span>
        <span class="ing-val">${scale(i.value,batchQty)} ${esc(i.unit)}</span>
      </div>`).join("");
    const waterScaled = r.water ? scale(r.water.qty, batchQty) : "—";
    const batches=BATCHES.map(q=>`<button class="batch-btn ${batchQty===q?"active":""}" onclick="setBatch(${q})">${batchLbl(q)}</button>`).join("");
    const mach=r.machine.filter(m=>m.value!==""&&m.value!==null).map(m=>`
      <div class="ing-row">
        <span class="ing-label">${esc(m.label)}</span>
        <span class="ing-val mach-val">${esc(m.value)} ${esc(m.unit)}</span>
      </div>`).join("");

    // Sizing table
    let sizingHtml="";
    if(r.sizingTable&&r.sizingTable.length>0){
      const hasPending=r.sizingTable.some(s=>s.status==="Pending Test");
      sizingHtml=`
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Dough Size → Output Size</span><div class="sec-rule"></div></div>
        ${hasPending?`<div class="info-banner" style="background:#FFF3DC;color:#D4841A;margin-bottom:10px">⚠ One or more sizes are pending team test before mass production.</div>`:""}
        <table class="size-table">
          <thead><tr><th>Dough (g)</th><th>Output Size</th><th>Status</th><th>Pieces / batch</th></tr></thead>
          <tbody>
            ${r.sizingTable.map(s=>{
              const pcs = s.dough ? Math.round((batchQty * (r.water ? r.water.qty + r.ingredients.reduce((a,i)=>a+(parseFloat(i.value)||0),0) : r.ingredients.reduce((a,i)=>a+(parseFloat(i.value)||0),0)) / s.dough)) : "—";
              // simpler: pieces = total batch weight / dough ball size
              const totalBase = r.ingredients.reduce((a,i)=>a+(parseFloat(i.value)||0),0) + (r.water?parseFloat(r.water.qty)||0:0);
              const pcsCalc = s.dough ? Math.round(totalBase * batchQty / s.dough) : "—";
              const pillClass = s.status==="Approved"?"pill-approved":s.status==="In Testing"?"pill-testing":"pill-pending";
              return `<tr>
                <td style="font-weight:700">${s.dough} g</td>
                <td>${esc(s.output)}</td>
                <td><span class="status-pill ${pillClass}">${esc(s.status)}</span></td>
                <td style="color:#4A5E40;font-weight:600">~${pcsCalc}</td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`;
    }

    main.innerHTML=`
      <div class="view-header">
        <div class="view-product">${esc(r.product)}</div>
        <div class="view-name">${esc(r.name)}</div>
        <div class="view-meta">${esc(r.id)} · v${esc(r.version)} · ${esc(r.date)}</div>
      </div>
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#B5AA9A;margin-bottom:8px">Batch size</div>
      <div class="batch-wrap">${batches}</div>
      <div class="info-banner">Quantities scaled to <strong>${batchLbl(batchQty)}</strong> batch</div>

      <div class="sec"><div class="sec-line"></div><span class="sec-text">Ingredients</span><div class="sec-rule"></div></div>
      ${ings}
      ${r.water?`<div class="ing-row">
        <span class="ing-label">Water <span class="water-temp-badge ${waterTempClass(r.water.temp)}">${esc(r.water.temp)}</span></span>
        <span class="ing-val">${waterScaled} ml</span>
      </div>`:""}

      <div class="sec"><div class="sec-line"></div><span class="sec-text">Machine Parameters</span><div class="sec-rule"></div></div>
      ${mach}

      ${sizingHtml}

      <div class="sec"><div class="sec-line"></div><span class="sec-text">Packaging & Storage</span><div class="sec-rule"></div></div>
      <div class="pkg-grid">
        ${r.packaging.coolingTime?`<div class="pkg-card"><div class="pkg-label">Cooling Time</div><div class="pkg-val">${esc(r.packaging.coolingTime)} min</div></div>`:""}
        <div class="pkg-card"><div class="pkg-label">Butter Paper</div><div class="pkg-val">${r.packaging.butterPaper?"✓ Yes":"✗ No"}</div></div>
        <div class="pkg-card"><div class="pkg-label">Dusting</div><div class="pkg-val">${r.packaging.dusting?"✓ Yes":"✗ No"}</div></div>
        <div class="pkg-card"><div class="pkg-label">Storage</div><div class="pkg-val">${r.packaging.storage==="deepFreeze"?"❄ Deep Freeze":"🌡 Refrigeration"}</div></div>
      </div>
      ${r.notes?`<div class="sec"><div class="sec-line"></div><span class="sec-text">Notes</span><div class="sec-rule"></div></div><div class="notes-box">${esc(r.notes)}</div>`:""}
      <button class="btn-full btn-dark" onclick="showShare()">📋 Generate Production Sheet</button>
      <button class="btn-full" style="background:#fff;color:#2C2420;border:1px solid #EDE8DF;margin-top:8px" onclick="showEdit()">✏️ Edit Recipe</button>
      <button class="btn-full" style="background:#fff;color:#B03A2E;border:1px solid #f0c0c0;margin-top:8px" onclick="confirmDelete('${esc(r.id)}')">🗑 Delete Recipe</button>
    `;
  }

  else if(view==="share"){
    const r=recipes.find(x=>x.id===selId); if(!r){view="list";render();return;}
    tb.innerHTML=`<button class="btn-secondary" onclick="view='view';render()">← Back</button>`;
    const q=batchQty;
    const totalBase=r.ingredients.reduce((a,i)=>a+(parseFloat(i.value)||0),0)+(r.water?parseFloat(r.water.qty)||0:0);
    const lines=[
      `🫓 ETHICAL DELIGHTS — PRODUCTION SHEET`,
      `Recipe: ${r.id} — ${r.name}`,
      `Product: ${r.product} | Batch: ${batchLbl(q)} | v${r.version}`,
      `Date: ${r.date}`,``,
      `📦 INGREDIENTS`,
      ...r.ingredients.filter(i=>i.value!=="").map(i=>`• ${i.label}: ${scale(i.value,q)} ${i.unit}`),
      r.water?`• Water (${r.water.temp}): ${scale(r.water.qty,q)} ml`:null,``,
      `⚙️ MACHINE PARAMETERS`,
      ...r.machine.filter(m=>m.value!=="").map(m=>`• ${m.label}: ${m.value} ${m.unit}`),``,
      r.sizingTable&&r.sizingTable.length>0?`📐 DOUGH SIZE → OUTPUT SIZE`:null,
      ...(r.sizingTable||[]).map(s=>{
        const pcs=s.dough?Math.round(totalBase*q/s.dough):"?";
        return `• ${s.dough}g dough → ${s.output} | ~${pcs} pcs/batch | [${s.status}]`;
      }),
      r.sizingTable&&r.sizingTable.length>0?"":null,
      `📋 PACKAGING`,
      `• Butter Paper: ${r.packaging.butterPaper?"Yes":"No"}`,
      `• Dusting: ${r.packaging.dusting?"Yes":"No"}`,
      `• Storage: ${r.packaging.storage==="deepFreeze"?"Deep Freeze":"Refrigeration"}`,
      r.packaging.coolingTime?`• Cooling Time: ${r.packaging.coolingTime} min`:null,``,
      r.notes?`📝 NOTES\n${r.notes}`:null
    ].filter(x=>x!==null).join("\n");
    window._shareText=lines;
    main.innerHTML=`
      <div class="sec"><div class="sec-line"></div><span class="sec-text">Production Sheet · ${batchLbl(q)} batch</span><div class="sec-rule"></div></div>
      <div class="share-box">${esc(lines)}</div>
      <button class="btn-full btn-dark" onclick="copySheet()">📋 Copy to clipboard</button>
      <button class="btn-full btn-moss" onclick="waShare()" style="margin-top:8px">💬 Share via WhatsApp</button>
    `;
  }

  else if(view==="add"||view==="edit"){
    const isEdit=view==="edit";
    const r=isEdit?recipes.find(x=>x.id===selId):null;
    tb.innerHTML=`<button class="btn-secondary" onclick="${isEdit?"view='view'":'view="list"'};render()">← Cancel</button>`;

    const ings=isEdit?r.ingredients:[
      {label:"Whole Wheat Type 1",value:"",unit:"g"},
      {label:"Whole Wheat Type 2",value:"",unit:"g"},
      {label:"Whole Wheat Type 3",value:"",unit:"g"},
      {label:"Maida",value:"",unit:"g"},
      {label:"Rava",value:"",unit:"g"},
      {label:"Curd",value:"",unit:"g"},
      {label:"Corn Dexgel",value:"",unit:"g"},
      {label:"Oil",value:"",unit:"ml"},
      {label:"Salt",value:"",unit:"g"},
      {label:"Sugar",value:"",unit:"g"},
      {label:"Aloo Flakes",value:"",unit:"g"},
      {label:"Enzyme / Softener",value:"",unit:"g"},
      {label:"Baking Soda",value:"",unit:"g"},
      {label:"Baking Powder",value:"",unit:"g"},
      {label:"Butter",value:"",unit:"g"},
      {label:"Milk Powder",value:"",unit:"g"},
    ];
    const water=isEdit?(r.water||{qty:"",temp:"Luke Warm"}):{qty:"",temp:"Luke Warm"};
    const mach=isEdit?r.machine:[
      {label:"Pressure",value:"",unit:"PSI"},
      {label:"Press Time",value:"",unit:"sec"},
      {label:"Plate / Stopper",value:"1.25",unit:"mm"},
      {label:"Temperature",value:"",unit:"°C"},
      {label:"Resting Time",value:"",unit:"min"},
    ];
    const sizing=isEdit?(r.sizingTable||[]):[];
    const pkg=isEdit?r.packaging:{coolingTime:"",butterPaper:false,dusting:false,storage:"refrigeration"};

    window._formIngs=JSON.parse(JSON.stringify(ings));
    window._formMach=JSON.parse(JSON.stringify(mach));
    window._formSizing=JSON.parse(JSON.stringify(sizing));

    main.innerHTML=`
      <div style="font-size:16px;font-weight:700;margin-bottom:16px">${isEdit?"Edit Recipe":"New Recipe"}</div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Identity</span><div class="sec-rule"></div></div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">Product</label>
            <select id="f-product" class="form-input">
              ${PRODUCTS.map(p=>`<option ${(isEdit?r.product:"")==p?"selected":""}>${p}</option>`).join("")}
            </select>
          </div>
          <div class="form-row">
            <label class="form-label">Recipe ID *</label>
            <input id="f-id" class="form-input" placeholder="e.g. CH-002" value="${isEdit?esc(r.id):""}" ${isEdit?"readonly":""}>
            <div class="form-error" id="err-id"></div>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">Recipe Name *</label>
          <input id="f-name" class="form-input" placeholder="e.g. Export Grade Soft Chapati" value="${isEdit?esc(r.name):""}">
          <div class="form-error" id="err-name"></div>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">Version</label>
            <input id="f-version" class="form-input" placeholder="1.0" value="${isEdit?esc(r.version):"1.0"}">
          </div>
          <div class="form-row">
            <label class="form-label">Date</label>
            <input id="f-date" type="date" class="form-input" value="${isEdit?r.date:new Date().toISOString().split("T")[0]}">
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Ingredients (per 1 kg flour)</span><div class="sec-rule"></div></div>
        <div class="form-grid">
          ${ings.map((ing,i)=>`
            <div class="form-row">
              <label class="form-label">${esc(ing.label)} (${esc(ing.unit)})</label>
              <input type="number" min="0" step="any" class="form-input ing-input" data-idx="${i}" placeholder="0" value="${esc(ing.value)}">
            </div>`).join("")}
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">Water (ml)</label>
            <input type="number" min="0" id="f-water-qty" class="form-input" placeholder="0" value="${esc(water.qty)}">
          </div>
          <div class="form-row">
            <label class="form-label">Water Temperature</label>
            <select id="f-water-temp" class="form-input">
              ${WATER_TEMPS.map(t=>`<option ${water.temp===t?"selected":""}>${t}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Machine Parameters</span><div class="sec-rule"></div></div>
        <div class="form-grid">
          ${mach.map((m,i)=>{
            if(m.label.includes("Plate")||m.label.includes("Stopper")){
              return `<div class="form-row">
                <label class="form-label">${esc(m.label)} (mm)</label>
                <select class="form-input mach-input" data-idx="${i}">
                  ${PLATE_SIZES.map(s=>`<option ${m.value==s?"selected":""}>${s}</option>`).join("")}
                </select>
              </div>`;
            }
            return `<div class="form-row">
              <label class="form-label">${esc(m.label)} (${esc(m.unit)})</label>
              <input type="${m.label==="Temperature"?"text":"number"}" min="0" step="any" class="form-input mach-input" data-idx="${i}" placeholder="${m.label==="Temperature"?"e.g. 120 / 140":"0"}" value="${esc(m.value)}">
            </div>`;
          }).join("")}
        </div>
      </div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Dough Size → Output Size</span><div class="sec-rule"></div></div>
        <p style="font-size:12px;color:#B5AA9A;margin-bottom:12px">Add one row per dough ball size option. Team will test each before mass production.</p>
        <div id="sizing-rows">
          ${sizing.map((s,i)=>sizingRowHtml(s,i)).join("")}
        </div>
        <button class="btn-add-size" onclick="addSizingRow()">+ Add Size Option</button>
      </div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Packaging & Storage</span><div class="sec-rule"></div></div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">Cooling Time (min)</label>
            <input type="number" min="0" id="f-cooling" class="form-input" placeholder="0" value="${esc(pkg.coolingTime)}">
          </div>
          <div class="form-row">
            <label class="form-label">Storage</label>
            <select id="f-storage" class="form-input">
              <option value="refrigeration" ${pkg.storage==="refrigeration"?"selected":""}>Refrigeration</option>
              <option value="deepFreeze" ${pkg.storage==="deepFreeze"?"selected":""}>Deep Freeze</option>
            </select>
          </div>
        </div>
        <div style="display:flex;gap:20px;margin-bottom:8px">
          <label class="form-check"><input type="checkbox" id="f-butter" ${pkg.butterPaper?"checked":""}> Butter Paper</label>
          <label class="form-check"><input type="checkbox" id="f-dusting" ${pkg.dusting?"checked":""}> Dusting</label>
        </div>
      </div>

      <div class="section-card">
        <div class="sec"><div class="sec-line"></div><span class="sec-text">Notes</span><div class="sec-rule"></div></div>
        <textarea id="f-notes" class="form-input" rows="3" placeholder="Trial results, quality notes, sourcing info…" style="resize:vertical">${isEdit?esc(r.notes):""}</textarea>
      </div>

      <button class="btn-full btn-ember" onclick="saveRecipe(${isEdit})">${isEdit?"Save Changes":"Add Recipe"}</button>
    `;
  }
}

function sizingRowHtml(s,i){
  return `<div class="size-row-form" id="srow-${i}">
    <div>
      <label class="form-label">Dough (g)</label>
      <input type="number" min="0" class="form-input sr-dough" data-idx="${i}" value="${s.dough||""}">
    </div>
    <div>
      <label class="form-label">Output Size</label>
      <input type="text" class="form-input sr-output" data-idx="${i}" placeholder="e.g. 7 inches" value="${esc(s.output||"")}">
    </div>
    <div>
      <label class="form-label">Status</label>
      <select class="form-input sr-status" data-idx="${i}">
        ${SIZE_STATUSES.map(st=>`<option ${(s.status||"Pending Test")===st?"selected":""}>${st}</option>`).join("")}
      </select>
    </div>
    <div>
      <label class="form-label">&nbsp;</label>
      <button class="btn-remove" onclick="removeSizingRow(${i})">✕</button>
    </div>
  </div>`;
}

function addSizingRow(){
  window._formSizing.push({dough:"",output:"",status:"Pending Test"});
  const i=window._formSizing.length-1;
  document.getElementById("sizing-rows").insertAdjacentHTML("beforeend",sizingRowHtml({dough:"",output:"",status:"Pending Test"},i));
}

function removeSizingRow(i){
  window._formSizing.splice(i,1);
  // re-render sizing section
  const isEdit=view==="edit";
  document.getElementById("sizing-rows").innerHTML=window._formSizing.map((s,idx)=>sizingRowHtml(s,idx)).join("");
}

function setFilter(p){ filterProd=p; render(); }
function viewRecipe(id){ selId=id; view="view"; batchQty=1; render(); }
function goList(){ view="list"; render(); }
function showAdd(){ view="add"; render(); }
function showEdit(){ view="edit"; render(); }
function showShare(){ view="share"; render(); }
function setBatch(q){ batchQty=q; render(); }

function confirmDelete(id){
  confirm2("Delete Recipe","This will permanently remove this recipe. Are you sure?",function(){
    recipes=recipes.filter(r=>r.id!==id); save(); view="list"; render();
  });
}

function collectSizing(){
  const rows=document.querySelectorAll(".sr-dough");
  const result=[];
  rows.forEach((_,i)=>{
    const d=document.querySelector(`.sr-dough[data-idx="${i}"]`);
    const o=document.querySelector(`.sr-output[data-idx="${i}"]`);
    const s=document.querySelector(`.sr-status[data-idx="${i}"]`);
    if(d&&o){
      result.push({dough:parseFloat(d.value)||0,output:o.value,status:s?s.value:"Pending Test"});
    }
  });
  return result.filter(r=>r.dough>0||r.output);
}

function saveRecipe(isEdit){
  const id=document.getElementById("f-id").value.trim().toUpperCase();
  const name=document.getElementById("f-name").value.trim();
  let valid=true;
  document.getElementById("err-id").textContent="";
  document.getElementById("err-name").textContent="";
  if(!id){ document.getElementById("err-id").textContent="Recipe ID is required"; valid=false; }
  if(!isEdit&&recipes.find(r=>r.id===id)){ document.getElementById("err-id").textContent="ID already exists"; valid=false; }
  if(!name){ document.getElementById("err-name").textContent="Recipe name is required"; valid=false; }
  if(!valid) return;

  const ingInputs=document.querySelectorAll(".ing-input");
  const ings=window._formIngs.map((ing,i)=>({...ing,value:ingInputs[i]?parseFloat(ingInputs[i].value)||"":""})).filter(i=>i.value!=="");

  const machInputs=document.querySelectorAll(".mach-input");
  const mach=window._formMach.map((m,i)=>({...m,value:machInputs[i]?machInputs[i].value:""}));

  const recipe={
    id, name,
    product: document.getElementById("f-product").value,
    version: document.getElementById("f-version").value||"1.0",
    date: document.getElementById("f-date").value,
    ingredients: ings,
    water:{
      qty: parseFloat(document.getElementById("f-water-qty").value)||"",
      temp: document.getElementById("f-water-temp").value,
    },
    machine: mach,
    sizingTable: collectSizing(),
    packaging:{
      coolingTime: document.getElementById("f-cooling").value,
      butterPaper: document.getElementById("f-butter").checked,
      dusting: document.getElementById("f-dusting").checked,
      storage: document.getElementById("f-storage").value,
    },
    notes: document.getElementById("f-notes").value,
  };

  if(isEdit){ recipes=recipes.map(r=>r.id===recipe.id?recipe:r); }
  else{ recipes.push(recipe); }
  save(); selId=recipe.id; view="view"; batchQty=1; render();
  toast(isEdit?"Recipe updated!":"Recipe added!");
}

function copySheet(){
  if(navigator.clipboard&&window._shareText){
    navigator.clipboard.writeText(window._shareText).then(()=>toast("Copied! Paste into WhatsApp."));
  } else {
    const ta=document.createElement("textarea"); ta.value=window._shareText;
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    toast("Copied!");
  }
}

function waShare(){
  if(window._shareText) window.open("https://wa.me/?text="+encodeURIComponent(window._shareText),"_blank");
}

render();
</script>
</body>
</html>
